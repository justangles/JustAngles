<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Angles | Vector Artboard Editor</title>
    <!-- Fabric.js Vector Canvas Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint: #00FF88;
            --orange: #FF9F43;
            --bg-canvas: #1E1E1E;     /* Figma Dark Workspace */
            --bg-panel: #2C2C2C;      /* Panels & Dock Surface */
            --bg-hover: #383838;
            --border-dark: #383838;
            --text-main: #FFFFFF;
            --text-muted: #B3B3B3;
            --accent-blue: #0C8CE9;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Navigation */
        header {
            width: 100%;
            height: 44px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            z-index: 30;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            color: #FFF;
        }

        .logo-icon { width: 22px; height: 22px; }

        .header-actions { display: flex; gap: 8px; }

        .btn-header {
            padding: 5px 12px;
            background-color: var(--bg-hover);
            color: var(--text-main);
            border: 1px solid var(--border-dark);
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .btn-header:hover { border-color: var(--mint); color: var(--mint); }
        .btn-blue { background-color: var(--accent-blue); border: none; color: #FFF; font-weight: 700; }
        .btn-blue:hover { background-color: #0077CC; color: #FFF; }

        /* Figma Workspace Layout */
        .workspace-grid {
            display: flex;
            flex: 1;
            height: calc(100vh - 44px);
            position: relative;
        }

        /* Left Panel (Layers & Assets) */
        .panel-left {
            width: 240px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-dark);
            display: flex;
            flex-direction: column;
            z-index: 20;
        }

        .panel-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-dark);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .tab-btn.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--accent-blue);
        }

        .panel-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel-title {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .layer-item {
            padding: 6px 8px;
            background-color: var(--bg-canvas);
            border: 1px solid var(--border-dark);
            border-radius: 4px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tool-btn {
            padding: 7px 10px;
            background-color: var(--bg-hover);
            color: var(--text-main);
            border: 1px solid var(--border-dark);
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.78rem;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tool-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
        }

        .color-swatch {
            height: 20px;
            border-radius: 3px;
            cursor: pointer;
            border: 1px solid var(--border-dark);
        }

        /* Center Infinite Canvas Stage */
        .stage-viewport {
            flex: 1;
            background-color: var(--bg-canvas);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: auto;
        }

        /* Right Panel (Inspector) */
        .panel-right {
            width: 230px;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border-dark);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
            overflow-y: auto;
        }

        .control-group { display: flex; flex-direction: column; gap: 3px; }
        label { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; }

        input[type="color"], select, input[type="range"] {
            width: 100%;
            background-color: var(--bg-canvas);
            border: 1px solid var(--border-dark);
            color: #FFF;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
        }

        /* Floating Bottom Figma Dock Bar */
        .floating-dock {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--bg-panel);
            border: 1px solid var(--border-dark);
            border-radius: 10px;
            padding: 6px 10px;
            display: flex;
            gap: 6px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            z-index: 40;
        }

        .dock-btn {
            background: none;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }

        .dock-btn:hover { background-color: var(--bg-hover); color: var(--text-main); }
        .dock-btn.active { background-color: var(--accent-blue); color: #FFF; }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="index.html" class="logo">
            <svg class="logo-icon" viewBox="0 0 100 100" fill="none">
                <polygon points="50,10 90,85 10,85" stroke="#00FF88" stroke-width="12" stroke-linejoin="round"/>
                <polygon points="50,30 75,75 25,75" stroke="#FF9F43" stroke-width="8" stroke-linejoin="round"/>
            </svg>
            Just Angles — Vector Artboards
        </a>

        <div class="header-actions">
            <button class="btn-header" onclick="saveProjectVirtual()">Save</button>
            <button class="btn-header" onclick="loadProjectVirtual()">Load</button>
            <button class="btn-header btn-blue" onclick="exportTransparentSVG()">Export SVG</button>
        </div>
    </header>

    <div class="workspace-grid">
        <!-- Left Layers & Assets Panel -->
        <div class="panel-left">
            <div class="panel-tabs">
                <button id="tabLayersBtn" class="tab-btn active" onclick="switchLeftTab('layers')">Layers</button>
                <button id="tabAssetsBtn" class="tab-btn" onclick="switchLeftTab('assets')">Assets & Character</button>
            </div>

            <!-- Layers Tab Content -->
            <div id="layersTabContent" class="panel-content">
                <div class="panel-title">Canvas Layers</div>
                <div id="layersList"></div>
            </div>

            <!-- Assets Tab Content -->
            <div id="assetsTabContent" class="panel-content" style="display:none;">
                <div class="panel-title">Character Builder</div>
                <button class="tool-btn" onclick="addBaseAvatar()">+ Add Base Avatar</button>
                <button class="tool-btn" onclick="addAfroHair()">+ Add Afro Hair</button>
                
                <div class="panel-title" style="margin-top:8px;">Skin Tone Palette</div>
                <div class="palette-grid">
                    <div class="color-swatch" style="background: #2D1A12;" onclick="setSkinTone('#2D1A12')"></div>
                    <div class="color-swatch" style="background: #3B2219;" onclick="setSkinTone('#3B2219')"></div>
                    <div class="color-swatch" style="background: #5C382A;" onclick="setSkinTone('#5C382A')"></div>
                    <div class="color-swatch" style="background: #8D5B4C;" onclick="setSkinTone('#8D5B4C')"></div>
                    <div class="color-swatch" style="background: #C68642;" onclick="setSkinTone('#C68642')"></div>
                    <div class="color-swatch" style="background: #E0AC69;" onclick="setSkinTone('#E0AC69')"></div>
                </div>

                <div class="panel-title" style="margin-top:12px;">Asset Vault</div>
                <button class="tool-btn" onclick="document.getElementById('assetUploader').click()">📷 Upload Vector/Image</button>
                <input type="file" id="assetUploader" style="display:none;" onchange="handleFileUpload(event)">
            </div>
        </div>

        <!-- Center Workspace Canvas Stage -->
        <div class="stage-viewport">
            <canvas id="artboardCanvas" width="950" height="750"></canvas>

            <!-- Floating Figma Bottom Dock -->
            <div class="floating-dock">
                <button id="dockSelect" class="dock-btn active" onclick="setSelectMode()">✦ Move</button>
                <button class="dock-btn" onclick="addArtboardFrame()"># Frame</button>
                <button class="dock-btn" onclick="addRectangle()">□ Rect</button>
                <button class="dock-btn" onclick="addCircle()">○ Circle</button>
                <button class="dock-btn" onclick="addPenPath()">✒ Pen</button>
                <button class="dock-btn" onclick="addText()">T Text</button>
            </div>
        </div>

        <!-- Right Design Inspector Panel -->
        <div class="panel-right">
            <div class="panel-title">Design Properties</div>
            
            <div class="control-group">
                <label>Fill Color</label>
                <input type="color" id="fillColorPicker" value="#00FF88" onchange="applyActiveFill(this.value)">
            </div>

            <div class="control-group">
                <label>Stroke Color</label>
                <input type="color" id="strokeColorPicker" value="#000000" onchange="applyActiveStroke(this.value)">
            </div>

            <div class="control-group">
                <label>Stroke Width (<span id="strokeWidthVal">2</span>px)</label>
                <input type="range" id="strokeWidthSlider" min="0" max="20" value="2" oninput="applyActiveStrokeWidth(this.value)">
            </div>

            <div class="panel-title" style="margin-top:10px;">Actions</div>
            <button class="tool-btn" style="color:#FF5555; border-color:#552222;" onclick="deleteSelected()">Delete Selected</button>
        </div>
    </div>

    <script>
        // Initialize Fabric.js Infinite Canvas
        const canvas = new fabric.Canvas('artboardCanvas', {
            backgroundColor: '#1E1E1E',
            selection: true
        });

        let artboardCount = 1;

        // Initialize White Frame 1 (Figma Style)
        function initDefaultFrame() {
            const frame = new fabric.Rect({
                left: 260, top: 80, width: 420, height: 550,
                fill: '#FFFFFF', rx: 4, ry: 4,
                selectable: true, evented: true, name: 'Frame 1'
            });

            const label = new fabric.Text('Frame 1', {
                left: 260, top: 58, fontSize: 13, fill: '#B3B3B3',
                fontFamily: 'Inter, sans-serif', selectable: false
            });

            canvas.add(frame, label);
            canvas.sendToBack(frame);
        }

        initDefaultFrame();

        // Canvas Change Event Triggers
        canvas.on('object:added', updateLayersList);
        canvas.on('object:modified', updateLayersList);
        canvas.on('object:removed', updateLayersList);

        function updateLayersList() {
            const layersList = document.getElementById('layersList');
            layersList.innerHTML = '';
            const objects = canvas.getObjects();

            if (objects.length === 0) {
                layersList.innerHTML = '<span style="font-size:0.7rem; color:var(--text-muted);">No elements on canvas</span>';
                return;
            }

            objects.slice().reverse().forEach((obj, idx) => {
                const item = document.createElement('div');
                item.className = 'layer-item';
                let name = obj.name || obj.type;
                item.innerHTML = `<span>${name}</span><span style="color:var(--accent-blue);">Layer</span>`;
                layersList.appendChild(item);
            });
        }

        // Left Panel Tabs
        function switchLeftTab(tab) {
            document.getElementById('tabLayersBtn').classList.toggle('active', tab === 'layers');
            document.getElementById('tabAssetsBtn').classList.toggle('active', tab === 'assets');
            document.getElementById('layersTabContent').style.display = tab === 'layers' ? 'flex' : 'none';
            document.getElementById('assetsTabContent').style.display = tab === 'assets' ? 'flex' : 'none';
        }

        // Add White Artboard Frame
        function addArtboardFrame() {
            setSelectMode();
            artboardCount++;
            const offset = artboardCount * 30 + 100;
            const frame = new fabric.Rect({
                left: offset, top: 80, width: 400, height: 520,
                fill: '#FFFFFF', rx: 4, ry: 4,
                selectable: true, evented: true, name: `Frame ${artboardCount}`
            });

            const label = new fabric.Text(`Frame ${artboardCount}`, {
                left: offset, top: 58, fontSize: 13, fill: '#B3B3B3',
                fontFamily: 'Inter, sans-serif', selectable: false
            });

            canvas.add(frame, label);
            canvas.sendToBack(frame);
        }

        // Mode Actions
        function setSelectMode() {
            canvas.isDrawingMode = false;
            document.getElementById('dockSelect').classList.add('active');
        }

        // Inspector Modifications
        function applyActiveFill(color) {
            const active = canvas.getActiveObject();
            if (active) { active.set('fill', color); canvas.renderAll(); }
        }

        function applyActiveStroke(color) {
            const active = canvas.getActiveObject();
            if (active) { active.set('stroke', color); canvas.renderAll(); }
        }

        function applyActiveStrokeWidth(val) {
            document.getElementById('strokeWidthVal').innerText = val;
            const active = canvas.getActiveObject();
            if (active) { active.set('strokeWidth', parseInt(val, 10)); canvas.renderAll(); }
        }

        // Shape & Vector Tools
        function addRectangle() {
            setSelectMode();
            const rect = new fabric.Rect({
                left: 320, top: 160, width: 120, height: 120,
                fill: document.getElementById('fillColorPicker').value,
                stroke: document.getElementById('strokeColorPicker').value, strokeWidth: 2
            });
            canvas.add(rect); canvas.setActiveObject(rect);
        }

        function addCircle() {
            setSelectMode();
            const circle = new fabric.Circle({
                left: 320, top: 160, radius: 60,
                fill: document.getElementById('fillColorPicker').value,
                stroke: document.getElementById('strokeColorPicker').value, strokeWidth: 2
            });
            canvas.add(circle); canvas.setActiveObject(circle);
        }

        function addPenPath() {
            setSelectMode();
            const path = new fabric.Path('M 100 100 Q 200 50 300 200 T 500 300', {
                left: 320, top: 160, fill: 'transparent',
                stroke: document.getElementById('strokeColorPicker').value, strokeWidth: 3
            });
            canvas.add(path); canvas.setActiveObject(path);
        }

        function addText() {
            setSelectMode();
            const text = new fabric.IText('Vector Text', {
                left: 320, top: 160, fontSize: 32, fill: '#1E1E1E', fontFamily: 'Inter, sans-serif'
            });
            canvas.add(text); canvas.setActiveObject(text);
        }

        // Character Builder
        function addBaseAvatar() {
            setSelectMode();
            const head = new fabric.Circle({ left: 350, top: 180, radius: 50, fill: '#8D5B4C', name: 'skin' });
            const neck = new fabric.Rect({ left: 386, top: 260, width: 28, height: 40, fill: '#7A4B3D', name: 'skin' });
            const avatarGroup = new fabric.Group([neck, head], { left: 350, top: 180 });
            canvas.add(avatarGroup); canvas.setActiveObject(avatarGroup);
        }

        function addAfroHair() {
            setSelectMode();
            const afro = new fabric.Circle({
                left: 320, top: 135, radius: 80, fill: '#1A1A1A', stroke: '#000000', strokeWidth: 2
            });
            canvas.add(afro); canvas.setActiveObject(afro);
        }

        function setSkinTone(colorHex) {
            const active = canvas.getActiveObject();
            if (active) {
                if (active.type === 'group') {
                    active.forEachObject(obj => { if (obj.name === 'skin') obj.set('fill', colorHex); });
                } else { active.set('fill', colorHex); }
                canvas.renderAll();
            }
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(f) {
                const data = f.target.result;
                fabric.Image.fromURL(data, function(img) {
                    img.set({ left: 300, top: 200, scaleX: 0.4, scaleY: 0.4 });
                    canvas.add(img); canvas.setActiveObject(img);
                });
            };
            reader.readAsDataURL(file);
        }

        function deleteSelected() {
            const active = canvas.getActiveObject();
            if (active) canvas.remove(active);
        }

        // Storage & Export
        function saveProjectVirtual() {
            localStorage.setItem('just_angles_artboard_project', JSON.stringify(canvas.toJSON()));
            alert('Artboard workspace saved!');
        }

        function loadProjectVirtual() {
            const saved = localStorage.getItem('just_angles_artboard_project');
            if (saved) {
                canvas.loadFromJSON(saved, function() { canvas.renderAll(); alert('Artboard workspace loaded!'); });
            } else { alert('No saved workspace found.'); }
        }

        function exportTransparentSVG() {
            const currentBG = canvas.backgroundColor;
            canvas.backgroundColor = 'transparent';
            const svgData = canvas.toSVG();
            canvas.backgroundColor = currentBG;
            canvas.renderAll();

            const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'just-angles-vector-artboard.svg';
            link.click();
        }
    </script>
</body>
</html>
