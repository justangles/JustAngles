<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Angles | Vector Artboard Editor</title>
    <!-- Fabric.js Vector Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint: #00FF88;
            --orange: #FF9F43;
            --bg-canvas: #1E1E1E;
            --bg-panel: #2C2C2C;
            --bg-card: #383838;
            --border-dark: #383838;
            --text-main: #FFFFFF;
            --text-muted: #B3B3B3;
            --accent-blue: #0C8CE9;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header Navigation */
        header {
            width: 100%;
            height: 44px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            z-index: 30;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            color: #FFF;
        }

        .logo-icon { width: 22px; height: 22px; }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-canvas);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-dark);
        }

        .zoom-btn {
            background: none;
            border: none;
            color: #FFF;
            font-weight: bold;
            cursor: pointer;
            padding: 2px 6px;
            font-size: 0.85rem;
        }

        .zoom-btn:hover { color: var(--mint); }

        .header-actions { display: flex; gap: 8px; }

        .btn-header {
            padding: 5px 12px;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-dark);
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .btn-header:hover { border-color: var(--mint); color: var(--mint); }
        .btn-blue { background-color: var(--accent-blue); border: none; color: #FFF; font-weight: 700; }

        /* App Workspace Layout */
        .workspace-grid {
            display: flex;
            flex: 1;
            height: calc(100vh - 44px);
            position: relative;
        }

        /* Left Panel */
        .panel-left {
            width: 250px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-dark);
            display: flex;
            flex-direction: column;
            z-index: 20;
        }

        .panel-tabs { display: flex; border-bottom: 1px solid var(--border-dark); }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .tab-btn.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--accent-blue);
        }

        .panel-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-title {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .tool-btn {
            padding: 8px 10px;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-dark);
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.78rem;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tool-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
        }

        .color-swatch {
            height: 22px;
            border-radius: 3px;
            cursor: pointer;
            border: 1px solid var(--border-dark);
        }

        .layer-item {
            padding: 6px 8px;
            background-color: var(--bg-canvas);
            border: 1px solid var(--border-dark);
            border-radius: 4px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .layer-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-dark);
            color: #FFF;
            padding: 2px 5px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.68rem;
        }

        .asset-vault-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: var(--bg-canvas);
            padding: 6px;
            border-radius: 5px;
            border: 1px solid var(--border-dark);
            max-height: 120px;
            overflow-y: auto;
        }

        .asset-item {
            width: 100%;
            height: 45px;
            border-radius: 3px;
            object-fit: cover;
            cursor: pointer;
            border: 1px solid var(--border-dark);
        }

        /* Canvas Stage */
        .stage-viewport {
            flex: 1;
            background-color: var(--bg-canvas);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: auto;
        }

        /* Right Inspector Panel */
        .panel-right {
            width: 220px;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border-dark);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
            overflow-y: auto;
        }

        .control-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; }

        input[type="color"], input[type="range"] {
            width: 100%;
            background-color: var(--bg-canvas);
            border: 1px solid var(--border-dark);
            color: #FFF;
            padding: 4px;
            border-radius: 4px;
        }

        /* Bottom Floating Dock */
        .floating-dock {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--bg-panel);
            border: 1px solid var(--border-dark);
            border-radius: 10px;
            padding: 6px 10px;
            display: flex;
            gap: 6px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            z-index: 40;
        }

        .dock-btn {
            background: none;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dock-btn:hover { background-color: var(--bg-card); color: var(--text-main); }
        .dock-btn.active { background-color: var(--accent-blue); color: #FFF; }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="index.html" class="logo">
            <svg class="logo-icon" viewBox="0 0 100 100" fill="none">
                <polygon points="50,10 90,85 10,85" stroke="#00FF88" stroke-width="12" stroke-linejoin="round"/>
                <polygon points="50,30 75,75 25,75" stroke="#FF9F43" stroke-width="8" stroke-linejoin="round"/>
            </svg>
            Just Angles — Vector Artboards
        </a>

        <!-- Canvas Zoom Controls -->
        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomCanvas(0.9)">-</button>
            <span id="zoomLevelText" style="font-size:0.75rem; font-weight:600;">100%</span>
            <button class="zoom-btn" onclick="zoomCanvas(1.1)">+</button>
            <button class="zoom-btn" style="color:var(--text-muted); font-size:0.7rem;" onclick="resetZoom()">Reset</button>
        </div>

        <div class="header-actions">
            <button class="btn-header" onclick="saveProjectVirtual()">Save</button>
            <button class="btn-header" onclick="loadProjectVirtual()">Load</button>
            <button class="btn-header btn-blue" onclick="exportTransparentSVG()">Export SVG</button>
        </div>
    </header>

    <div class="workspace-grid">
        <!-- Left Panel -->
        <div class="panel-left">
            <div class="panel-tabs">
                <button id="tabLayersBtn" class="tab-btn active" onclick="switchLeftTab('layers')">Layers</button>
                <button id="tabCharacterBtn" class="tab-btn" onclick="switchLeftTab('character')">Character Design</button>
                <button id="tabVaultBtn" class="tab-btn" onclick="switchLeftTab('vault')">Media Vault</button>
            </div>

            <!-- Layers Inspector -->
            <div id="layersTabContent" class="panel-content">
                <div class="panel-title">Layers Inspector</div>
                <div id="layersList"></div>
            </div>

            <!-- Character Design Tab -->
            <div id="characterTabContent" class="panel-content" style="display:none;">
                <div class="panel-title">Character Design</div>
                <button class="tool-btn" onclick="addBaseAvatar()">+ Base Avatar</button>
                <button class="tool-btn" onclick="addAfroHair()">+ Hair Asset</button>
                
                <div class="panel-title" style="margin-top:6px;">Skin Tone Palette</div>
                <div class="palette-grid">
                    <div class="color-swatch" style="background: #2D1A12;" onclick="setSkinTone('#2D1A12')"></div>
                    <div class="color-swatch" style="background: #3B2219;" onclick="setSkinTone('#3B2219')"></div>
                    <div class="color-swatch" style="background: #5C382A;" onclick="setSkinTone('#5C382A')"></div>
                    <div class="color-swatch" style="background: #8D5B4C;" onclick="setSkinTone('#8D5B4C')"></div>
                    <div class="color-swatch" style="background: #C68642;" onclick="setSkinTone('#C68642')"></div>
                    <div class="color-swatch" style="background: #E0AC69;" onclick="setSkinTone('#E0AC69')"></div>
                </div>
            </div>

            <!-- Media Vault Tab -->
            <div id="vaultTabContent" class="panel-content" style="display:none;">
                <div class="panel-title">Personal Assets</div>
                <button class="tool-btn" onclick="document.getElementById('vaultUploader').click()">📷 Upload SVG / Image</button>
                <input type="file" id="vaultUploader" style="display:none;" onchange="handleFileUpload(event)">

                <div id="assetVaultBank" class="asset-vault-grid" style="margin-top:8px;">
                    <span style="font-size:0.65rem; color:var(--text-muted); grid-column: 1 / -1;">Vault empty...</span>
                </div>
            </div>
        </div>

        <!-- Canvas Stage -->
        <div class="stage-viewport">
            <canvas id="artboardCanvas" width="1800" height="900"></canvas>

            <!-- Bottom Floating Dock Bar -->
            <div class="floating-dock">
                <button id="dockSelect" class="dock-btn active" onclick="setSelectMode()">✦ Move</button>
                <button id="dockFrame" class="dock-btn" onclick="enableFrameDrawMode()"># Draw Frame</button>
                <button id="dockPencil" class="dock-btn" onclick="setFreehandPencilMode()">✏ Vector Pencil</button>
                <button class="dock-btn" onclick="addRectangle()">□ Rect</button>
                <button class="dock-btn" onclick="addCircle()">○ Circle</button>
                <button class="dock-btn" onclick="addPenPath()">✒ Pen</button>
                <button class="dock-btn" onclick="addText()">T Text</button>
            </div>
        </div>

        <!-- Right Design Inspector -->
        <div class="panel-right">
            <div class="panel-title">Design Inspector</div>
            
            <div class="control-group">
                <label>Fill Color</label>
                <input type="color" id="fillColorPicker" value="#00FF88" onchange="applyActiveFill(this.value)">
            </div>

            <div class="control-group">
                <label>Stroke Color</label>
                <input type="color" id="strokeColorPicker" value="#000000" onchange="applyActiveStroke(this.value)">
            </div>

            <div class="control-group">
                <label>Stroke Width (<span id="strokeWidthVal">2</span>px)</label>
                <input type="range" id="strokeWidthSlider" min="0" max="25" value="2" oninput="applyActiveStrokeWidth(this.value)">
            </div>

            <div class="panel-title" style="margin-top:10px;">Actions</div>
            <button class="tool-btn" style="color:#FF5555; border-color:#552222;" onclick="deleteSelected()">Delete Selected</button>
        </div>
    </div>

    <script>
        const canvas = new fabric.Canvas('artboardCanvas', {
            backgroundColor: '#1E1E1E',
            selection: true
        });

        // Setup Pencil Brush
        canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
        canvas.freeDrawingBrush.color = '#00FF88';
        canvas.freeDrawingBrush.width = 3;

        let frameIndex = 1;
        let isDrawingFrame = false;
        let frameStartPoint = null;
        let tempFrameRect = null;
        let currentZoom = 1.0;

        // Initialize Default Side-by-Side Artboard Frame
        function initDefaultFrame() {
            createFrameObj(100, 80, 420, 550, 'Frame 1');
        }

        function createFrameObj(leftPos, topPos, w, h, title) {
            const frame = new fabric.Rect({
                left: leftPos, top: topPos, width: w, height: h,
                fill: '#FFFFFF', rx: 4, ry: 4,
                selectable: true, evented: true, name: title
            });

            const label = new fabric.Text(title, {
                left: leftPos, top: topPos - 22, fontSize: 13, fill: '#B3B3B3',
                fontFamily: 'Inter, sans-serif', selectable: false
            });

            canvas.add(frame, label);
            canvas.sendToBack(frame);
        }

        initDefaultFrame();

        // Canvas Zoom Controls
        function zoomCanvas(factor) {
            currentZoom = currentZoom * factor;
            canvas.setZoom(currentZoom);
            document.getElementById('zoomLevelText').innerText = `${Math.round(currentZoom * 100)}%`;
        }

        function resetZoom() {
            currentZoom = 1.0;
            canvas.setZoom(1.0);
            document.getElementById('zoomLevelText').innerText = '100%';
        }

        // Draw Custom Frame Click & Drag Interactive Engine
        function enableFrameDrawMode() {
            setSelectMode();
            isDrawingFrame = true;
            canvas.defaultCursor = 'crosshair';
            document.getElementById('dockFrame').classList.add('active');
            document.getElementById('dockSelect').classList.remove('active');
        }

        canvas.on('mouse:down', function(o) {
            if (!isDrawingFrame) return;
            const pointer = canvas.getPointer(o.e);
            frameStartPoint = { x: pointer.x, y: pointer.y };
            tempFrameRect = new fabric.Rect({
                left: pointer.x, top: pointer.y, width: 0, height: 0,
                fill: '#FFFFFF', stroke: '#0C8CE9', strokeWidth: 1, rx: 4, ry: 4
            });
            canvas.add(tempFrameRect);
        });

        canvas.on('mouse:move', function(o) {
            if (!isDrawingFrame || !tempFrameRect) return;
            const pointer = canvas.getPointer(o.e);
            if (frameStartPoint.x > pointer.x) tempFrameRect.set({ left: Math.abs(pointer.x) });
            if (frameStartPoint.y > pointer.y) tempFrameRect.set({ top: Math.abs(pointer.y) });
            tempFrameRect.set({ width: Math.abs(frameStartPoint.x - pointer.x) });
            tempFrameRect.set({ height: Math.abs(frameStartPoint.y - pointer.y) });
            canvas.renderAll();
        });

        canvas.on('mouse:up', function(o) {
            if (!isDrawingFrame || !tempFrameRect) return;
            isDrawingFrame = false;
            canvas.defaultCursor = 'default';
            document.getElementById('dockFrame').classList.remove('active');
            document.getElementById('dockSelect').classList.add('active');

            frameIndex++;
            const title = `Frame ${frameIndex}`;
            tempFrameRect.set({ stroke: 'transparent', strokeWidth: 0, name: title });
            
            const label = new fabric.Text(title, {
                left: tempFrameRect.left, top: tempFrameRect.top - 22, fontSize: 13, fill: '#B3B3B3',
                fontFamily: 'Inter, sans-serif', selectable: false
            });

            canvas.add(label);
            canvas.sendToBack(tempFrameRect);
            tempFrameRect = null;
            canvas.renderAll();
        });

        // Canvas Change Event Triggers for Layers
        canvas.on('object:added', updateLayersList);
        canvas.on('object:modified', updateLayersList);
        canvas.on('object:removed', updateLayersList);

        function updateLayersList() {
            const layersList = document.getElementById('layersList');
            layersList.innerHTML = '';
            const objects = canvas.getObjects();

            if (objects.length === 0) {
                layersList.innerHTML = '<span style="font-size:0.7rem; color:var(--text-muted);">Canvas empty</span>';
                return;
            }

            objects.slice().reverse().forEach((obj, idx) => {
                const realIdx = objects.length - 1 - idx;
                const item = document.createElement('div');
                item.className = 'layer-item';
                let name = obj.name || obj.type;
                if (obj.type === 'i-text') name = 'Text';
                else if (obj.type === 'path') name = 'Vector Path';
                
                item.innerHTML = `
                    <span>${name}</span>
                    <div style="display:flex; gap:3px;">
                        <button class="layer-btn" onclick="moveLayerUp(${realIdx})">▲</button>
                        <button class="layer-btn" onclick="moveLayerDown(${realIdx})">▼</button>
                    </div>`;
                layersList.appendChild(item);
            });
        }

        function moveLayerUp(idx) {
            const objects = canvas.getObjects();
            if (idx < objects.length - 1) {
                canvas.bringForward(objects[idx]);
                canvas.renderAll();
                updateLayersList();
            }
        }

        function moveLayerDown(idx) {
            const objects = canvas.getObjects();
            if (idx > 0) {
                canvas.sendBackwards(objects[idx]);
                canvas.renderAll();
                updateLayersList();
            }
        }

        // Left Panel Tabs
        function switchLeftTab(tab) {
            document.getElementById('tabLayersBtn').classList.toggle('active', tab === 'layers');
            document.getElementById('tabCharacterBtn').classList.toggle('active', tab === 'character');
            document.getElementById('tabVaultBtn').classList.toggle('active', tab === 'vault');
            
            document.getElementById('layersTabContent').style.display = tab === 'layers' ? 'flex' : 'none';
            document.getElementById('characterTabContent').style.display = tab === 'character' ? 'flex' : 'none';
            document.getElementById('vaultTabContent').style.display = tab === 'vault' ? 'flex' : 'none';
        }

        // Mode Actions
        function setSelectMode() {
            canvas.isDrawingMode = false;
            document.getElementById('dockSelect').classList.add('active');
            document.getElementById('dockPencil').classList.remove('active');
        }

        function setFreehandPencilMode() {
            canvas.isDrawingMode = true;
            document.getElementById('dockPencil').classList.add('active');
            document.getElementById('dockSelect').classList.remove('active');
        }

        // Inspector Controls
        function applyActiveFill(color) {
            canvas.freeDrawingBrush.color = color;
            const active = canvas.getActiveObject();
            if (active) { active.set('fill', color); canvas.renderAll(); }
        }

        function applyActiveStroke(color) {
            const active = canvas.getActiveObject();
            if (active) { active.set('stroke', color); canvas.renderAll(); }
        }

        function applyActiveStrokeWidth(val) {
            document.getElementById('strokeWidthVal').innerText = val;
            canvas.freeDrawingBrush.width = parseInt(val, 10);
            const active = canvas.getActiveObject();
            if (active) { active.set('strokeWidth', parseInt(val, 10)); canvas.renderAll(); }
        }

        // Vector Shapes & Text
        function addRectangle() {
            setSelectMode();
            const rect = new fabric.Rect({
                left: 180, top: 180, width: 130, height: 130,
                fill: document.getElementById('fillColorPicker').value,
                stroke: document.getElementById('strokeColorPicker').value, strokeWidth: 2
            });
            canvas.add(rect); canvas.setActiveObject(rect);
        }

        function addCircle() {
            setSelectMode();
            const circle = new fabric.Circle({
                left: 180, top: 180, radius: 60,
                fill: document.getElementById('fillColorPicker').value,
                stroke: document.getElementById('strokeColorPicker').value, strokeWidth: 2
            });
            canvas.add(circle); canvas.setActiveObject(circle);
        }

        function addPenPath() {
            setSelectMode();
            const path = new fabric.Path('M 100 100 Q 200 50 300 200 T 500 300', {
                left: 180, top: 180, fill: 'transparent',
                stroke: document.getElementById('strokeColorPicker').value, strokeWidth: 3
            });
            canvas.add(path); canvas.setActiveObject(path);
        }

        function addText() {
            setSelectMode();
            const text = new fabric.IText('Editable Vector Text', {
                left: 180, top: 180, fontSize: 28, fill: '#1E1E1E', fontFamily: 'Inter, sans-serif'
            });
            canvas.add(text); canvas.setActiveObject(text);
        }

        // Character Builder
        function addBaseAvatar() {
            setSelectMode();
            const head = new fabric.Circle({ left: 200, top: 180, radius: 50, fill: '#8D5B4C', name: 'skin' });
            const neck = new fabric.Rect({ left: 236, top: 260, width: 28, height: 40, fill: '#7A4B3D', name: 'skin' });
            const avatarGroup = new fabric.Group([neck, head], { left: 200, top: 180 });
            canvas.add(avatarGroup); canvas.setActiveObject(avatarGroup);
        }

        function addAfroHair() {
            setSelectMode();
            const afro = new fabric.Circle({
                left: 170, top: 135, radius: 80, fill: '#1A1A1A', stroke: '#000000', strokeWidth: 2
            });
            canvas.add(afro); canvas.setActiveObject(afro);
        }

        function setSkinTone(colorHex) {
            const active = canvas.getActiveObject();
            if (active) {
                if (active.type === 'group') {
                    active.forEachObject(obj => { if (obj.name === 'skin') obj.set('fill', colorHex); });
                } else { active.set('fill', colorHex); }
                canvas.renderAll();
            }
        }

        // Media Upload Handler
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(f) {
                const data = f.target.result;

                const bank = document.getElementById('assetVaultBank');
                const imgThumb = document.createElement('img');
                imgThumb.src = data;
                imgThumb.className = 'asset-item';
                imgThumb.onclick = function() { placeMediaFromVault(data); };
                bank.appendChild(imgThumb);

                placeMediaFromVault(data);
            };
            reader.readAsDataURL(file);
        }

        function placeMediaFromVault(data) {
            fabric.Image.fromURL(data, function(img) {
                img.set({ left: 180, top: 180, scaleX: 0.4, scaleY: 0.4 });
                canvas.add(img); canvas.setActiveObject(img);
            });
        }

        function deleteSelected() {
            const active = canvas.getActiveObject();
            if (active) canvas.remove(active);
        }

        // Storage & Export
        function saveProjectVirtual() {
            localStorage.setItem('just_angles_artboard_project', JSON.stringify(canvas.toJSON()));
            alert('Artboard workspace saved!');
        }

        function loadProjectVirtual() {
            const saved = localStorage.getItem('just_angles_artboard_project');
            if (saved) {
                canvas.loadFromJSON(saved, function() { canvas.renderAll(); alert('Artboard workspace loaded!'); });
            } else { alert('No saved workspace found.'); }
        }

        function exportTransparentSVG() {
            const currentBG = canvas.backgroundColor;
            canvas.backgroundColor = 'transparent';
            const svgData = canvas.toSVG();
            canvas.backgroundColor = currentBG;
            canvas.renderAll();

            const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'just-angles-vector-artboards.svg';
            link.click();
        }
    </script>
</body>
</html>
