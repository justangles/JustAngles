<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Angles | Vector Canvas Editor</title>
    <!-- Fabric.js Library for Vector Canvas Editing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 2.2rem; margin: 5px 0; }
        .tag {
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #00ff88;
            display: inline-block;
        }
        .workspace {
            display: flex;
            gap: 20px;
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 950px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 200px;
        }
        .btn {
            padding: 10px 14px;
            background-color: #222;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: left;
            transition: all 0.2s;
        }
        .btn:hover {
            border-color: #00ff88;
            color: #00ff88;
        }
        .btn-accent {
            background-color: #00ff88;
            color: #000;
            border: none;
            text-align: center;
            margin-top: 10px;
        }
        .btn-accent:hover {
            background-color: #00cc6d;
            color: #000;
        }
        .canvas-container-wrap {
            border: 1px dashed #444;
            border-radius: 8px;
            background: #050505;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="tag">100% Human Vectors • Zero AI Flags</div>
        <h1>Just Angles Editor</h1>
    </div>

    <div class="workspace">
        <!-- Controls Sidebar -->
        <div class="toolbar">
            <button class="btn" onclick="addHeading()">+ Add Heading</button>
            <button class="btn" onclick="addSubtext()">+ Add Body Text</button>
            <button class="btn" onclick="addSquare()">+ Add Square</button>
            <button class="btn" onclick="addCircle()">+ Add Circle</button>
            <button class="btn" style="color: #ff5555; border-color: #442222;" onclick="deleteSelected()">Delete Selected</button>
            <hr style="border: 0; border-top: 1px solid #333; width: 100%; margin: 10px 0;">
            <button class="btn btn-accent" onclick="exportSVG()">Export Clean SVG</button>
        </div>

        <!-- Interactive Vector Canvas -->
        <div class="canvas-container-wrap">
            <canvas id="editorCanvas" width="500" height="500"></canvas>
        </div>
    </div>

    <script>
        // Initialize Fabric.js Canvas
        const canvas = new fabric.Canvas('editorCanvas', {
            backgroundColor: '#111111'
        });

        // Add Default Template Elements
        const defaultTitle = new fabric.IText('Just Angles', {
            left: 140,
            top: 180,
            fontFamily: 'system-ui, sans-serif',
            fontSize: 40,
            fill: '#ffffff',
            fontWeight: 'bold'
        });

        const defaultSub = new fabric.IText('Clean Human Vector Design', {
            left: 130,
            top: 240,
            fontFamily: 'system-ui, sans-serif',
            fontSize: 18,
            fill: '#00ff88'
        });

        canvas.add(defaultTitle, defaultSub);

        // Helper Functions
        function addHeading() {
            const text = new fabric.IText('New Heading', {
                left: 150, top: 100,
                fontSize: 32, fill: '#ffffff', fontWeight: 'bold'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        function addSubtext() {
            const text = new fabric.IText('Edit this text...', {
                left: 150, top: 150,
                fontSize: 18, fill: '#aaaaaa'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        function addSquare() {
            const rect = new fabric.Rect({
                left: 200, top: 200, fill: 'transparent',
                stroke: '#00ff88', strokeWidth: 3, width: 100, height: 100
            });
            canvas.add(rect);
            canvas.setActiveObject(rect);
        }

        function addCircle() {
            const circle = new fabric.Circle({
                left: 200, top: 200, fill: 'transparent',
                stroke: '#00ff88', strokeWidth: 3, radius: 50
            });
            canvas.add(circle);
            canvas.setActiveObject(circle);
        }

        function deleteSelected() {
            const active = canvas.getActiveObject();
            if (active) canvas.remove(active);
        }

        function exportSVG() {
            const svgData = canvas.toSVG();
            const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'just-angles-template.svg';
            link.click();
        }
    </script>
</body>
</html>
