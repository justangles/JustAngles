<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Angles | Dual Engine Editor</title>
    <!-- Fabric.js Vector Canvas Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        :root {
            --mint: #00FF88;
            --orange: #FF9F43;
            --bg-main: #1C2026;       /* Mid-Tone Slate */
            --bg-surface: #252A32;    /* Workspace Panels */
            --bg-canvas: #121518;     /* Inner Canvas */
            --border-muted: #343B46;  /* Borders */
            --text-main: #FFFFFF;
            --text-muted: #9DA8B6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Header & Mode Navigation */
        header {
            width: 100%;
            max-width: 1300px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            box-sizing: border-box;
            border-bottom: 1px solid var(--border-muted);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.25rem;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo-icon { width: 28px; height: 28px; }

        .editor-mode-toggle {
            display: flex;
            background-color: #121518;
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-muted);
        }

        .mode-btn {
            padding: 8px 18px;
            border: none;
            background: none;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background-color: var(--mint);
            color: #000;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            padding: 8px 14px;
            background-color: #2F3642;
            color: var(--text-main);
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-action:hover { border-color: var(--mint); color: var(--mint); }

        .btn-mint {
            background-color: var(--mint);
            color: #000;
            font-weight: 700;
            border: none;
        }
        .btn-mint:hover { background-color: #00E67A; color: #000; }

        /* Workspace Grid */
        .workspace {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1300px;
            padding: 20px 24px;
            box-sizing: border-box;
            flex-wrap: wrap;
        }

        .sidebar {
            width: 280px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-muted);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-sizing: border-box;
            max-height: 82vh;
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin: 10px 0 4px 0;
            border-bottom: 1px solid var(--border-muted);
            padding-bottom: 4px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }

        input[type="color"], select, input[type="range"] {
            width: 100%;
            background-color: #121518;
            border: 1px solid var(--border-muted);
            color: #FFF;
            padding: 6px;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.85rem;
        }

        .tool-btn {
            padding: 9px 12px;
            background-color: #2F3642;
            color: var(--text-main);
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tool-btn:hover { border-color: var(--mint); color: var(--mint); }
        .tool-btn.active { background-color: var(--mint); color: #000; border-color: var(--mint); }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .color-swatch {
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid var(--border-muted);
        }

        .stage {
            flex: 1;
            min-width: 550px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-muted);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            position: relative;
        }

        .canvas-container-wrap {
            background: var(--bg-canvas);
            border: 1px dashed var(--border-muted);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .mode-indicator {
            align-self: flex-start;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--orange);
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <!-- Header & Engine Switcher -->
    <header>
        <a href="index.html" class="logo">
            <svg class="logo-icon" viewBox="0 0 100 100" fill="none">
                <polygon points="50,10 90,85 10,85" stroke="#00FF88" stroke-width="12" stroke-linejoin="round"/>
                <polygon points="50,30 75,75 25,75" stroke="#FF9F43" stroke-width="8" stroke-linejoin="round"/>
            </svg>
            Just Angles Editor
        </a>

        <!-- Dual Engine Switcher -->
        <div class="editor-mode-toggle">
            <button id="pagesEngineBtn" class="mode-btn active" onclick="switchEngine('pages')">Layout Editor (Pages)</button>
            <button id="artboardsEngineBtn" class="mode-btn" onclick="switchEngine('artboards')">Vector Editor (Artboards)</button>
        </div>

        <div class="header-actions">
            <button class="btn-action" onclick="saveProjectVirtual()">Save Project</button>
            <button class="btn-action" onclick="loadProjectVirtual()">Load Saved</button>
            <button class="btn-action btn-mint" onclick="exportSVG()">Export Clean SVG</button>
        </div>
    </header>

    <div class="workspace">
        <!-- Main Sidebar Controls -->
        <div class="sidebar">
            
            <h3>Drawing & Vector Tools</h3>
            <button id="selectToolBtn" class="tool-btn active" onclick="setSelectMode()">✦ Select / Move</button>
            <button id="drawToolBtn" class="tool-btn" onclick="setDrawMode()">✏ Freehand Vector Pencil</button>

            <div class="control-group">
                <label>Line / Brush Color</label>
                <input type="color" id="strokeColorPicker" value="#00FF88" onchange="updateStrokeColor(this.value)">
            </div>

            <div class="control-group">
                <label>Brush Size (<span id="brushSizeVal">3</span>px)</label>
                <input type="range" id="brushSize" min="1" max="40" value="3" oninput="updateBrushSize(this.value)">
            </div>

            <h3>Typography & Fonts</h3>
            <button class="tool-btn" onclick="addText()">+ Add Text Layer</button>
            <div class="control-group">
                <label>Font Style</label>
                <select id="fontSelect" onchange="updateFont(this.value)">
                    <option value="-apple-system, sans-serif">Sans-Serif (Modern)</option>
                    <option value="Georgia, serif">Serif (Book / Print)</option>
                    <option value="'Courier New', monospace">Monospace (Technical)</option>
                    <option value="'Impact', display">Display (Bold Headline)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Text Color</label>
                <input type="color" id="textColorPicker" value="#FFFFFF" onchange="updateTextColor(this.value)">
            </div>

            <h3>Afrocentric Avatar Builder</h3>
            <button class="tool-btn" onclick="addBaseAvatar()">+ Add Character Base</button>
            <button class="tool-btn" onclick="addAfroHair()">+ Add Afro Hair Layer</button>
            <label>Melanin Skin Tone Swatches</label>
            <div class="palette-grid">
                <div class="color-swatch" style="background: #3B2219;" onclick="setSkinTone('#3B2219')"></div>
                <div class="color-swatch" style="background: #5C382A;" onclick="setSkinTone('#5C382A')"></div>
                <div class="color-swatch" style="background: #8D5B4C;" onclick="setSkinTone('#8D5B4C')"></div>
                <div class="color-swatch" style="background: #C68642;" onclick="setSkinTone('#C68642')"></div>
            </div>

            <h3>Canvas & Shapes</h3>
            <button class="tool-btn" onclick="addRectangle()">+ Add Rect Path</button>
            <button class="tool-btn" onclick="addCircle()">+ Add Circle Path</button>
            <button class="tool-btn" style="color:#FF5555; border-color:#552222;" onclick="deleteSelected()">Delete Selected</button>

        </div>

        <!-- Editor Canvas Stage -->
        <div class="stage">
            <div id="modeIndicator" class="mode-indicator">Mode: Layout Editor (Uniform Book Pages)</div>
            <div class="canvas-container-wrap">
                <canvas id="mainCanvas" width="650" height="650"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Initialize Fabric.js Canvas
        const canvas = new fabric.Canvas('mainCanvas', {
            backgroundColor: '#121518'
        });

        // Drawing Brush Setup
        canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
        canvas.freeDrawingBrush.color = '#00FF88';
        canvas.freeDrawingBrush.width = 3;

        let currentEngine = 'pages'; // 'pages' or 'artboards'

        // Engine Mode Switcher
        function switchEngine(mode) {
            currentEngine = mode;
            const indicator = document.getElementById('modeIndicator');
            const pagesBtn = document.getElementById('pagesEngineBtn');
            const artboardsBtn = document.getElementById('artboardsEngineBtn');

            if (mode === 'pages') {
                pagesBtn.classList.add('active');
                artboardsBtn.classList.remove('active');
                indicator.innerText = 'Mode: Layout Editor (Uniform Page Spreads & Trim Bleeds)';
                indicator.style.color = '#FF9F43';
                canvas.setWidth(650);
                canvas.setHeight(650);
            } else {
                artboardsBtn.classList.add('active');
                pagesBtn.classList.remove('active');
                indicator.innerText = 'Mode: Vector Editor (Freeform Multi-Canvas Artboards)';
                indicator.style.color = '#00FF88';
                canvas.setWidth(800);
                canvas.setHeight(650);
            }
            canvas.renderAll();
        }

        // Mode Toggles
        function setSelectMode() {
            canvas.isDrawingMode = false;
            document.getElementById('selectToolBtn').classList.add('active');
            document.getElementById('drawToolBtn').classList.remove('active');
        }

        function setDrawMode() {
            canvas.isDrawingMode = true;
            document.getElementById('drawToolBtn').classList.add('active');
            document.getElementById('selectToolBtn').classList.remove('active');
        }

        function updateStrokeColor(color) {
            canvas.freeDrawingBrush.color = color;
            const active = canvas.getActiveObject();
            if (active) {
                if (active.stroke) active.set('stroke', color);
                canvas.renderAll();
            }
        }

        function updateBrushSize(size) {
            document.getElementById('brushSizeVal').innerText = size;
            canvas.freeDrawingBrush.width = parseInt(size, 10);
        }

        // Typography Actions
        function addText() {
            setSelectMode();
            const text = new fabric.IText('Your Typography Here', {
                left: 180, top: 200,
                fontSize: 28, fill: '#FFFFFF',
                fontFamily: document.getElementById('fontSelect').value
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        function updateFont(fontFamily) {
            const active = canvas.getActiveObject();
            if (active && active.type === 'i-text') {
                active.set('fontFamily', fontFamily);
                canvas.renderAll();
            }
        }

        function updateTextColor(color) {
            const active = canvas.getActiveObject();
            if (active && active.type === 'i-text') {
                active.set('fill', color);
                canvas.renderAll();
            }
        }

        // Afrocentric Avatar Actions
        function addBaseAvatar() {
            setSelectMode();
            const head = new fabric.Circle({
                left: 260, top: 180, radius: 65, fill: '#8D5B4C', name: 'skin'
            });
            const neck = new fabric.Rect({
                left: 300, top: 290, width: 35, height: 50, fill: '#7A4B3D', name: 'skin'
            });
            const avatarGroup = new fabric.Group([neck, head], { left: 240, top: 180 });
            canvas.add(avatarGroup);
            canvas.setActiveObject(avatarGroup);
        }

        function addAfroHair() {
            setSelectMode();
            const afro = new fabric.Circle({
                left: 215, top: 125, radius: 95,
                fill: '#1A1A1A', stroke: '#000000', strokeWidth: 2
            });
            canvas.add(afro);
            canvas.setActiveObject(afro);
        }

        function setSkinTone(colorHex) {
            const active = canvas.getActiveObject();
            if (active) {
                if (active.type === 'group') {
                    active.forEachObject(obj => {
                        if (obj.name === 'skin') obj.set('fill', colorHex);
                    });
                } else {
                    active.set('fill', colorHex);
                }
                canvas.renderAll();
            }
        }

        // Basic Shapes
        function addRectangle() {
            setSelectMode();
            const rect = new fabric.Rect({
                left: 220, top: 220, width: 120, height: 120,
                fill: 'transparent', stroke: '#00FF88', strokeWidth: 3
            });
            canvas.add(rect);
            canvas.setActiveObject(rect);
        }

        function addCircle() {
            setSelectMode();
            const circle = new fabric.Circle({
                left: 220, top: 220, radius: 60,
                fill: 'transparent', stroke: '#FF9F43', strokeWidth: 3
            });
            canvas.add(circle);
            canvas.setActiveObject(circle);
        }

        function deleteSelected() {
            const active = canvas.getActiveObject();
            if (active) canvas.remove(active);
        }

        // Virtual Project Storage
        function saveProjectVirtual() {
            const jsonState = JSON.stringify(canvas.toJSON());
            localStorage.setItem('just_angles_saved_project', jsonState);
            alert('Project saved virtually in your browser storage!');
        }

        function loadProjectVirtual() {
            const savedData = localStorage.getItem('just_angles_saved_project');
            if (savedData) {
                canvas.loadFromJSON(savedData, function() {
                    canvas.renderAll();
                    alert('Virtual project loaded successfully!');
                });
            } else {
                alert('No saved virtual project found.');
            }
        }

        // SVG Export
        function exportSVG() {
            const svgData = canvas.toSVG();
            const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `just-angles-${currentEngine}-design.svg`;
            link.click();
        }
    </script>
</body>
</html>
