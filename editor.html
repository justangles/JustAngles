<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Angles | Anti-AI Workspace</title>
    <!-- Fabric.js Vector Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        :root {
            --mint: #00FF88;
            --orange: #FF9F43;
            --bg-main: #1C2026;       /* Mid-Tone Charcoal */
            --bg-surface: #252A32;    /* Workspace Panels */
            --bg-canvas: #121518;     /* Canvas Backdrop */
            --border-muted: #343B46;  /* Panel Borders */
            --text-main: #FFFFFF;
            --text-muted: #9DA8B6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Nav Header */
        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 32px;
            box-sizing: border-box;
            border-bottom: 1px solid var(--border-muted);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.3rem;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo-icon { width: 30px; height: 30px; }

        .tag {
            background: rgba(0, 255, 136, 0.12);
            border: 1px solid var(--mint);
            color: var(--mint);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Workspace Layout */
        .workspace-container {
            display: flex;
            gap: 24px;
            width: 100%;
            max-width: 1200px;
            padding: 24px 32px;
            box-sizing: border-box;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Sidebar Controls */
        .toolbar {
            width: 240px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-muted);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }

        .toolbar h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin: 10px 0 4px 0;
        }

        .tool-btn {
            padding: 10px 14px;
            background-color: #2F3642;
            color: var(--text-main);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tool-btn:hover {
            border-color: var(--mint);
            color: var(--mint);
        }

        .tool-btn.active {
            background-color: var(--mint);
            color: #000;
            border-color: var(--mint);
        }

        .btn-export {
            background-color: var(--mint);
            color: #0B0E11;
            font-weight: 700;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            text-align: center;
            font-size: 0.95rem;
        }

        .btn-export:hover { background-color: #00E67A; }

        /* Canvas Stage */
        .stage {
            flex: 1;
            min-width: 520px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-muted);
            border-radius: 14px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .canvas-wrapper {
            background: var(--bg-canvas);
            border: 1px dashed var(--border-muted);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <svg class="logo-icon" viewBox="0 0 100 100" fill="none">
                <polygon points="50,10 90,85 10,85" stroke="#00FF88" stroke-width="12" stroke-linejoin="round"/>
                <polygon points="50,30 75,75 25,75" stroke="#FF9F43" stroke-width="8" stroke-linejoin="round"/>
            </svg>
            Just Angles Editor
        </a>
        <div class="tag">100% Anti-AI Vector Engine</div>
    </header>

    <div class="workspace-container">
        <!-- Tools Sidebar -->
        <div class="toolbar">
            <h3>Mode</h3>
            <button id="selectModeBtn" class="tool-btn active" onclick="setSelectMode()">
                <span>✦ Select / Move</span>
            </button>
            <button id="drawModeBtn" class="tool-btn" onclick="setDrawMode()">
                <span>✏ Vector Pencil</span>
                <span style="color: var(--orange); font-size: 0.75rem;">Freehand</span>
            </button>

            <h3>Layout & Text</h3>
            <button class="tool-btn" onclick="addHeading()">+ Add Typography</button>
            <button class="tool-btn" onclick="addArtboardBorder()">+ Artboard Frame</button>

            <h3>Vector Shapes</h3>
            <button class="tool-btn" onclick="addSquare()">+ Square Path</button>
            <button class="tool-btn" onclick="addCircle()">+ Circle Path</button>

            <h3>Actions</h3>
            <button class="tool-btn" style="color: #FF5555; border-color: #552222;" onclick="deleteSelected()">Delete Item</button>

            <hr style="border:0; border-top: 1px solid var(--border-muted); margin: 12px 0;">

            <button class="btn-export" onclick="exportSVG()">Export Clean SVG</button>
        </div>

        <!-- Canvas Stage -->
        <div class="stage">
            <div class="canvas-wrapper">
                <canvas id="editorCanvas" width="600" height="600"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Initialize Vector Canvas
        const canvas = new fabric.Canvas('editorCanvas', {
            backgroundColor: '#121518'
        });

        // Setup Freehand Pencil Brush Properties
        canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
        canvas.freeDrawingBrush.color = '#00FF88';
        canvas.freeDrawingBrush.width = 3;

        // Mode Toggles
        function setSelectMode() {
            canvas.isDrawingMode = false;
            document.getElementById('selectModeBtn').classList.add('active');
            document.getElementById('drawModeBtn').classList.remove('active');
        }

        function setDrawMode() {
            canvas.isDrawingMode = true;
            document.getElementById('drawModeBtn').classList.add('active');
            document.getElementById('selectModeBtn').classList.remove('active');
        }

        // Default Template Graphics
        const title = new fabric.IText('Just Angles', {
            left: 170, top: 220,
            fontFamily: '-apple-system, sans-serif',
            fontSize: 42, fill: '#ffffff', fontWeight: 'bold'
        });

        const sub = new fabric.IText('Draw or Edit Clean Vector Paths', {
            left: 155, top: 280,
            fontFamily: '-apple-system, sans-serif',
            fontSize: 18, fill: '#FF9F43'
        });

        canvas.add(title, sub);

        // Helper Tools
        function addHeading() {
            setSelectMode();
            const text = new fabric.IText('Book Title Layout', {
                left: 170, top: 120, fontSize: 28, fill: '#FFFFFF', fontWeight: 'bold'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        function addArtboardBorder() {
            setSelectMode();
            const rect = new fabric.Rect({
                left: 40, top: 40, width: 520, height: 520,
                fill: 'transparent', stroke: '#343B46', strokeWidth: 2,
                strokeDashArray: [6, 6], selectable: false
            });
            canvas.add(rect);
            canvas.sendToBack(rect);
        }

        function addSquare() {
            setSelectMode();
            const rect = new fabric.Rect({
                left: 240, top: 340, width: 120, height: 120,
                fill: 'transparent', stroke: '#00FF88', strokeWidth: 3
            });
            canvas.add(rect);
            canvas.setActiveObject(rect);
        }

        function addCircle() {
            setSelectMode();
            const circle = new fabric.Circle({
                left: 240, top: 340, radius: 60,
                fill: 'transparent', stroke: '#FF9F43', strokeWidth: 3
            });
            canvas.add(circle);
            canvas.setActiveObject(circle);
        }

        function deleteSelected() {
            const active = canvas.getActiveObject();
            if (active) canvas.remove(active);
        }

        function exportSVG() {
            const svgData = canvas.toSVG();
            const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'just-angles-vector.svg';
            link.click();
        }
    </script>
</body>
</html>
