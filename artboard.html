<button class="tool" id="customArtboardBtn">
  ＋ Create Custom Artboard
</button>

<div class="modal wide" id="customArtboardModal">
  <div>
    <h2>Create Custom Artboard</h2>

    <p>
      Set the exact canvas size. You can resize it later
      from the Artboard section in the inspector.
    </p>

    <div class="modal-grid">

      <div class="field">
        <label>Artboard Name</label>
        <input
          class="search"
          id="customAbName"
          value="Custom Artboard"
        >
      </div>

      <div class="field">
        <label>Background</label>
        <input
          type="color"
          id="customAbBg"
          value="#ffffff"
        >
      </div>

      <div class="field">
        <label>Width (px)</label>
        <input
          class="search"
          id="customAbW"
          type="number"
          min="1"
          value="1600"
        >
      </div>

      <div class="field">
        <label>Height (px)</label>
        <input
          class="search"
          id="customAbH"
          type="number"
          min="1"
          value="900"
        >
      </div>

    </div>

    <div class="modal-actions">
      <button class="headbtn" id="customAbCancel">
        Cancel
      </button>

      <button class="headbtn primary" id="customAbCreate">
        Create Artboard
      </button>
    </div>
  </div>
</div>
