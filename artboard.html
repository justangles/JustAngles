<header class="figma-header">

    <div class="header-left">
        <div class="brand">
            <svg viewBox="0 0 100 100">
                <polygon
                    points="50,10 90,85 10,85"
                    fill="none"
                    stroke="#00FF88"
                    stroke-width="12"
                />
                <polygon
                    points="50,30 75,75 25,75"
                    fill="none"
                    stroke="#FF9F43"
                    stroke-width="8"
                />
            </svg>

            <span>Just Angles</span>
        </div>

        <div class="menu-group">
            <button onclick="newProject()">File</button>
            <button>Edit</button>
            <button>View</button>
            <button>Object</button>
        </div>
    </div>

    <div class="tool-mode">

        <button
            id="selectTool"
            class="toolbar-tool active"
            onclick="setTool('select')"
            title="Move / Select (V)">
            ↖
        </button>

        <button
            class="toolbar-tool"
            onclick="setTool('frame')"
            title="Frame (F)">
            #
        </button>

        <button
            class="toolbar-tool"
            onclick="setTool('rectangle')"
            title="Rectangle (R)">
            □
        </button>

        <button
            class="toolbar-tool"
            onclick="setTool('ellipse')"
            title="Ellipse (O)">
            ○
        </button>

        <button
            class="toolbar-tool"
            onclick="setTool('pen')"
            title="Pen (P)">
            ✒
        </button>

        <button
            class="toolbar-tool"
            onclick="setTool('text')"
            title="Text (T)">
            T
        </button>

        <button
            class="toolbar-tool"
            onclick="setTool('hand')"
            title="Hand (H)">
            ✋
        </button>

    </div>

    <div class="header-right">

        <button onclick="undo()">↶</button>
        <button onclick="redo()">↷</button>

        <div class="zoom-controls">

            <button onclick="zoomCanvas(0.9)">−</button>

            <span id="zoomLevelText">100%</span>

            <button onclick="zoomCanvas(1.1)">+</button>

        </div>

        <button class="btn-header">
            Share
        </button>

        <button
            class="btn-header btn-blue"
            onclick="exportTransparentSVG()">
            Export
        </button>

    </div>

</header>
