<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Just Angles — Artboard Designer v8</title>
<style>
:root{
  --bg:#0b0d10;
  --panel:#12161b;
  --panel2:#171c22;
  --line:#2b3139;
  --text:#f2f4f7;
  --muted:#9aa4b2;
  --accent:#8b5cf6;
  --accent2:#a78bfa;
  --danger:#ef4444;
  --shadow:0 12px 40px rgba(0,0,0,.35);
  --radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}
button,input,select{font:inherit}
button{color:inherit}
.app{
  height:100vh;
  display:grid;
  grid-template-rows:42px 40px 1fr 28px;
}
.topbar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  background:#0f1216;
  border-bottom:1px solid var(--line);
}
.brand{
  font-weight:800;
  letter-spacing:.02em;
  white-space:nowrap;
}
.menu{
  display:flex;
  gap:4px;
}
.menu button,
.toolbtn,
.actionbtn,
.iconbtn{
  border:1px solid transparent;
  background:transparent;
  border-radius:7px;
  padding:6px 9px;
  cursor:pointer;
}
.menu button:hover,
.toolbtn:hover,
.actionbtn:hover,
.iconbtn:hover{
  background:#1b2027;
  border-color:#303741;
}
.spacer{flex:1}
.document-name{
  color:var(--muted);
  font-size:12px;
}
.toolbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
  background:#11151a;
  border-bottom:1px solid var(--line);
  overflow:auto;
}
.toolbar-group{
  display:flex;
  align-items:center;
  gap:3px;
  padding-right:8px;
  border-right:1px solid var(--line);
}
.toolbar-group:last-child{border-right:0}
.toolbtn{
  min-width:34px;
  height:30px;
  padding:4px 8px;
  font-size:12px;
}
.toolbtn.active{
  background:#29203f;
  border-color:#7046d4;
  color:#d8c7ff;
}
.main{
  min-height:0;
  display:grid;
  grid-template-columns:52px 1fr 310px;
}
.leftbar{
  background:#11151a;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:8px 5px;
  gap:4px;
}
.leftbar .toolbtn{
  width:40px;
  padding:4px 2px;
  font-size:10px;
}
.workspace{
  position:relative;
  min-width:0;
  min-height:0;
  overflow:hidden;
  background:
    radial-gradient(circle at center,rgba(139,92,246,.07),transparent 42%),
    #20242a;
}
.workspace canvas{
  position:absolute;
  inset:0;
}
.rightbar{
  min-width:0;
  overflow:auto;
  background:var(--panel);
  border-left:1px solid var(--line);
}
.panel{
  border-bottom:1px solid var(--line);
  padding:12px;
}
.panel-title{
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.09em;
  color:#c7ced8;
  margin-bottom:10px;
}
.row{
  display:flex;
  align-items:center;
  gap:8px;
}
.row + .row{margin-top:8px}
.row label{
  flex:0 0 82px;
  color:var(--muted);
  font-size:11px;
}
.row input,
.row select{
  min-width:0;
  flex:1;
  width:100%;
  background:#0d1014;
  color:var(--text);
  border:1px solid #303640;
  border-radius:6px;
  padding:6px 7px;
  outline:none;
}
.row input:focus,
.row select:focus{
  border-color:#7251c9;
}
.color-field{
  display:flex;
  align-items:center;
  gap:6px;
  flex:1;
}
.color-field input[type=color]{
  width:34px;
  height:28px;
  padding:2px;
  flex:0 0 34px;
}
.color-field input[type=text]{
  min-width:0;
}
.appearance-swatch{
  width:28px;
  height:28px;
  border:1px solid #3a414b;
  border-radius:5px;
  cursor:pointer;
}
.none-swatch{
  background:
    linear-gradient(45deg,transparent 46%,#ef4444 47%,#ef4444 53%,transparent 54%),
    #fff;
}
.selection-info{
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}
.asset-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.asset-grid button{
  background:#181d23;
  border:1px solid #303640;
  border-radius:7px;
  padding:9px 6px;
  font-size:11px;
  cursor:pointer;
}
.asset-grid button:hover{
  border-color:#7251c9;
  background:#201b2b;
}
.status{
  height:28px;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 10px;
  background:#0f1216;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
}
.contextbar{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 9px;
  background:rgba(18,22,27,.94);
  border:1px solid #333a44;
  border-radius:9px;
  box-shadow:var(--shadow);
  z-index:20;
}
.contextbar label{
  font-size:10px;
  color:var(--muted);
}
.contextbar input,
.contextbar select{
  width:72px;
  background:#0d1014;
  border:1px solid #303640;
  border-radius:5px;
  color:var(--text);
  padding:4px 5px;
}
.contextbar .smallbtn{
  border:1px solid #303640;
  background:#181d23;
  border-radius:5px;
  padding:4px 7px;
  cursor:pointer;
  font-size:10px;
}
.hidden{display:none!important}
#canvas{
  cursor:default;
}
.workspace.pen #canvas{cursor:crosshair}
.workspace.curvature #canvas{cursor:crosshair}
.workspace.anchor #canvas{cursor:crosshair}
.workspace.direct #canvas{cursor:default}
.workspace.hand #canvas{cursor:grab}
.workspace.hand.panning #canvas{cursor:grabbing}
.workspace.artboard #canvas{cursor:default}
.workspace.shape #canvas{cursor:crosshair}
.workspace.ellipse #canvas{cursor:crosshair}
.workspace.polygon #canvas{cursor:crosshair}
.workspace.star #canvas{cursor:crosshair}
.workspace.line #canvas{cursor:crosshair}
.workspace.text #canvas{cursor:text}
.notice{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  padding:7px 10px;
  background:rgba(18,22,27,.92);
  border:1px solid #303640;
  border-radius:7px;
  color:#d6dbe3;
  font-size:11px;
  pointer-events:none;
  z-index:15;
}
.artboard-list{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.artboard-item{
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px;
  border:1px solid #2d343d;
  border-radius:6px;
  background:#171c22;
  cursor:pointer;
}
.artboard-item.active{
  border-color:#7251c9;
  background:#201b2b;
}
.artboard-item .name{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:11px;
}
.artboard-item .size{
  color:var(--muted);
  font-size:9px;
}
.layers{
  display:flex;
  flex-direction:column;
  gap:3px;
}
.layer{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px;
  border-radius:6px;
  font-size:11px;
}
.layer:hover{background:#191f26}
.layer.selected{background:#241d35}
.layer .eye{
  width:20px;
  text-align:center;
  cursor:pointer;
}
.layer .layer-name{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
kbd{
  background:#0c0f13;
  border:1px solid #303640;
  border-bottom-color:#1e242c;
  border-radius:4px;
  padding:1px 4px;
  font-size:9px;
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">JUST ANGLES</div>
    <div class="menu">
      <button id="newBtn">File</button>
      <button id="editBtn">Edit</button>
      <button id="viewBtn">View</button>
      <button id="objectBtn">Object</button>
    </div>
    <div class="spacer"></div>
    <div class="document-name" id="documentName">Untitled</div>
    <button class="actionbtn" id="saveBtn">Save</button>
    <button class="actionbtn" id="loadBtn">Load</button>
  </div>

  <div class="toolbar">
    <div class="toolbar-group">
      <button class="toolbtn" data-tool="select">Select</button>
      <button class="toolbtn" data-tool="direct">Direct</button>
    </div>
    <div class="toolbar-group">
      <button class="toolbtn" data-tool="pen">Pen</button>
      <button class="toolbtn" data-tool="curvature">Curvature</button>
      <button class="toolbtn" data-tool="anchor">Anchor</button>
      <button class="toolbtn" data-tool="add-anchor">+ Anchor</button>
      <button class="toolbtn" data-tool="delete-anchor">− Anchor</button>
    </div>
    <div class="toolbar-group">
      <button class="toolbtn" data-tool="shape">Rectangle</button>
      <button class="toolbtn" data-tool="ellipse">Ellipse</button>
      <button class="toolbtn" data-tool="polygon">Polygon</button>
      <button class="toolbtn" data-tool="star">Star</button>
      <button class="toolbtn" data-tool="line">Line</button>
      <button class="toolbtn" data-tool="text">Text</button>
    </div>
    <div class="toolbar-group">
      <button class="toolbtn" data-tool="artboard">Artboard</button>
      <button class="toolbtn" data-tool="hand">Hand</button>
      <button class="toolbtn" data-tool="zoom">Zoom</button>
    </div>
    <div class="spacer"></div>
    <div class="row" style="width:auto">
      <label style="flex:0 0 auto">Fill</label>
      <input id="topFill" type="color" value="#ffffff" style="width:28px;height:26px;padding:1px">
      <label style="flex:0 0 auto">Stroke</label>
      <input id="topStroke" type="color" value="#111111" style="width:28px;height:26px;padding:1px">
      <input id="topStrokeWidth" type="number" value="1" min="0" max="100" step=".5" style="width:55px">
    </div>
  </div>

  <div class="main">
    <div class="leftbar">
      <button class="toolbtn" data-tool="select">↖<br>Select</button>
      <button class="toolbtn" data-tool="direct">◇<br>Direct</button>
      <button class="toolbtn" data-tool="pen">✒<br>Pen</button>
      <button class="toolbtn" data-tool="curvature">⌒<br>Curve</button>
      <button class="toolbtn" data-tool="anchor">⌁<br>Anchor</button>
      <button class="toolbtn" data-tool="add-anchor">＋<br>Add</button>
      <button class="toolbtn" data-tool="delete-anchor">−<br>Delete</button>
      <button class="toolbtn" data-tool="shape">□<br>Rect</button>
      <button class="toolbtn" data-tool="ellipse">○<br>Ellipse</button>
      <button class="toolbtn" data-tool="polygon">⬡<br>Poly</button>
      <button class="toolbtn" data-tool="star">★<br>Star</button>
      <button class="toolbtn" data-tool="line">╱<br>Line</button>
      <button class="toolbtn" data-tool="text">T<br>Text</button>
      <button class="toolbtn" data-tool="artboard">▧<br>Board</button>
      <button class="toolbtn" data-tool="hand">✋<br>Hand</button>
      <button class="toolbtn" data-tool="zoom">⌕<br>Zoom</button>
    </div>

    <div class="workspace" id="workspace">
      <div class="notice" id="notice">Select a tool to begin.</div>
      <canvas id="canvas"></canvas>
      <div class="contextbar hidden" id="penContext">
        <label>Fill</label>
        <button class="smallbtn" id="fillNoneBtn">None</button>
        <input id="contextFill" type="color" value="#ffffff">
        <label>Stroke</label>
        <input id="contextStroke" type="color" value="#111111">
        <label>Weight</label>
        <input id="contextStrokeWidth" type="number" min="0" max="100" step=".5" value="1">
        <button class="smallbtn" id="swapBtn">Swap</button>

    <aside class="rightbar">

        <div class="selection-info" id="selectionInfo">Nothing selected.</div>
      </div>

      <div class="panel">
        <div class="panel-title">Appearance</div>

        <div class="row">
          <label>Fill</label>
          <div class="color-field">
            <input id="fillColor" type="color" value="#ffffff">
            <input id="fillText" type="text" value="#ffffff">

        <div class="row">
          <label>Stroke</label>

            <input id="strokeColor" type="color" value="#111111">
            <input id="strokeText" type="text" value="#111111">

        <div class="row">
          <label>Y</label>
          <input id="objY" type="number" step=".1">
        </div>
        <div class="row">
          <label>Width</label>
          <input id="objW" type="number" min="1" step=".1">
        </div>
        <div class="row">
          <label>Height</label>
          <input id="objH" type="number" min="1" step=".1">
        </div>
        <div class="row">
          <label>Rotation</label>
          <input id="objAngle" type="number" step=".1">

      <div class="panel">
        <div class="panel-title">Artboards</div>
        <div class="asset-grid">
          <button data-preset="blank">Blank 1600×900</button>
          <button data-preset="webtoon">Webtoon 1080×1920</button>

  <div class="status">
    <span id="statusText">Ready</span>
    <span id="artboardStatus">Artboard: —</span>
    <span id="zoomStatus">100%</span>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);

  const canvas = new fabric.Canvas('canvas', {
    backgroundColor: '#20242a',
    preserveObjectStacking: true,
    selection: true,
    stopContextMenu: true
  });

  const workspace = $('workspace');

  let activeTool = 'select';
  let activeArtboardId = null;
  let artboards = [];
  let nextId = 1;
  let penState = null;
  let shapeState = null;
  let handState = null;
  let directControls = [];
  let suppressSelectionEvent = false;

  const DEFAULT_APPEARANCE = {
    fill: null,
    stroke: '#111111',
    strokeWidth: 1,
    strokeLineCap: 'butt',
    strokeLineJoin: 'miter'
  };

  let currentAppearance = {...DEFAULT_APPEARANCE};

  const PRESETS = {
    blank:      {name:'Blank Artboard', w:1600, h:900},
    webtoon:    {name:'Webtoon Vertical', w:1080, h:1920},
    novel:      {name:'Novel Page', w:1600, h:2560},
    cover:      {name:'Book Cover', w:1600, h:2560},
    comic:      {name:'Comic Page', w:2100, h:3000},
    character:  {name:'Character Sheet', w:2000, h:2400}
  };

  function uid(prefix='id'){
    return prefix + (nextId++);
  }

  function setStatus(text){
    $('statusText').textContent = text;
  }

  function resizeCanvas(){
    const rect = workspace.getBoundingClientRect();
    canvas.setWidth(rect.width);
    canvas.setHeight(rect.height);
    canvas.calcOffset();
    canvas.requestRenderAll();
  }

  window.addEventListener('resize', resizeCanvas);

  function getCanvasCenter(){
    return {
      x: canvas.getWidth() / 2,
      y: canvas.getHeight() / 2
    };
  }

  function worldToScreen(point){
    const vpt = canvas.viewportTransform;
    return {
      x: point.x * vpt[0] + vpt[4],
      y: point.y * vpt[3] + vpt[5]
    };
  }

  function screenToWorld(point){
    const vpt = canvas.viewportTransform;
    return {
      x: (point.x - vpt[4]) / vpt[0],
      y: (point.y - vpt[5]) / vpt[3]
    };
  }

  function getPointer(e){
    return canvas.getPointer(e.e || e);
  }

  function fitRectToView(left, top, width, height, padding=70){
    const cw = canvas.getWidth();
    const ch = canvas.getHeight();

    if (!cw || !ch || width <= 0 || height <= 0) return;

    const zoom = Math.min(
      (cw - padding * 2) / width,
      (ch - padding * 2) / height
    );

    const z = Math.max(.05, Math.min(4, zoom));

    canvas.setZoom(z);

    const x = (cw - width * z) / 2 - left * z;
    const y = (ch - height * z) / 2 - top * z;

    canvas.absolutePan(new fabric.Point(-x, -y));
    updateZoomStatus();
    canvas.requestRenderAll();
  }

  function updateZoomStatus(){
    const z = canvas.getZoom();
    $('zoomStatus').textContent = Math.round(z * 100) + '%';
  }

  function clearSelection(){
    canvas.discardActiveObject();
    clearDirectControls();
    canvas.requestRenderAll();
  }

  function getActiveObject(){
    return canvas.getActiveObject();
  }

  function activeArtboard(){
    return artboards.find(a => a.id === activeArtboardId) || null;
  }

  function artboardByObject(obj){
    return artboards.find(a => a.rect === obj || a.id === obj?.jaArtboardId) || null;
  }

  function makeArtboardRect(ab){
    if (ab.rect) {
      canvas.remove(ab.rect);
    }

    const rect = new fabric.Rect({
      left: ab.x,
      top: ab.y,
      width: ab.w,
      height: ab.h,
      fill: '#ffffff',
      stroke: '#8b5cf6',
      strokeWidth: 1 / canvas.getZoom(),
      selectable: activeTool === 'artboard',
      evented: true,
      hasControls: activeTool === 'artboard',
      lockRotation: true,
      transparentCorners: false,
      cornerColor: '#8b5cf6',
      cornerStrokeColor: '#ffffff',
      borderColor: '#8b5cf6',
      excludeFromExport: false
    });

    rect.jaType = 'artboard';
    rect.jaArtboardId = ab.id;
    rect.name = ab.name;

    ab.rect = rect;
    canvas.add(rect);
    canvas.sendToBack(rect);
  }

  function addArtboard(presetKey='blank'){
    const p = PRESETS[presetKey] || PRESETS.blank;

    const offset = artboards.length * 80;

    const id = uid('artboard_');

    const ab = {
      id,
      name: p.name,
      w: p.w,
      h: p.h,
      x: 0 + offset,
      y: 0 + offset,
      preset: presetKey,
      rect: null
    };

    artboards.push(ab);
    activeArtboardId = id;

    makeArtboardRect(ab);
    setActiveArtboard(id);
    renderLayers();

    fitRectToView(ab.x, ab.y, ab.w, ab.h);
    setStatus(`${p.name} created`);
  }

  function setActiveArtboard(id){
    const ab = artboards.find(a => a.id === id);
    if (!ab) return;

    activeArtboardId = id;

    artboards.forEach(a => {
      if (!a.rect) return;
      a.rect.set({
        selectable: activeTool === 'artboard',
        evented: true,
        stroke: a.id === id ? '#8b5cf6' : '#565d68',
        strokeWidth: 1 / canvas.getZoom()
      });
    });

    $('artboardStatus').textContent =
      `Artboard: ${ab.name} · ${Math.round(ab.w)} × ${Math.round(ab.h)}`;

    renderLayers();
    canvas.requestRenderAll();
  }

  function ensureDefaultArtboard(){
    if (!artboards.length){
      addArtboard('blank');
    }
  }

  function setTool(tool){
    if (activeTool === 'pen' && tool !== 'pen'){
      finishPen(false);
    }

    if (activeTool === 'curvature' && tool !== 'curvature'){
      finishPen(false);
    }

    clearDirectControls();

    activeTool = tool;

    workspace.className = 'workspace ' + tool;

    document.querySelectorAll('[data-tool]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tool === tool);
    });

    canvas.selection = tool === 'select';

    canvas.forEachObject(obj => {
      if (obj.jaType === 'artboard'){
        obj.selectable = tool === 'artboard';
        obj.evented = true;
      } else {
        obj.selectable = tool === 'select';
        obj.evented = tool === 'select' || tool === 'direct' ||
                      tool === 'anchor' ||
                      tool === 'add-anchor' ||
                      tool === 'delete-anchor';
      }
    });

    if (tool === 'pen'){
      $('notice').textContent =
        'Pen: click for corners · click-drag for curves · click first point to close';
      $('penContext').classList.remove('hidden');
    } else if (tool === 'curvature'){
      $('notice').textContent =
        'Curvature: click points to create smooth curves · click existing points to edit';
      $('penContext').classList.remove('hidden');
    } else if (tool === 'direct'){
      $('notice').textContent =
        'Direct Select: select and drag individual vector anchors';
      $('penContext').classList.add('hidden');
    } else if (tool === 'anchor'){
      $('notice').textContent =
        'Anchor Point: click a vector anchor to convert corner/smooth';
      $('penContext').classList.add('hidden');
    } else if (tool === 'add-anchor'){
      $('notice').textContent =
        'Add Anchor: click a path segment to insert an anchor';
      $('penContext').classList.add('hidden');
    } else if (tool === 'delete-anchor'){
      $('notice').textContent =
        'Delete Anchor: click an anchor to remove it';
      $('penContext').classList.add('hidden');
    } else if (tool === 'shape'){
      $('notice').textContent =

    } else if (tool === 'artboard'){

  function normalizeHex(value, fallback){
    if (!value) return fallback;
    const v = value.trim();

    if (/^#[0-9a-fA-F]{6}$/.test(v)) return v;
    if (/^#[0-9a-fA-F]{3}$/.test(v)){
      return '#' + v.slice(1).split('').map(x => x + x).join('');
    }

    return fallback;
  }

  function createVectorPath(nodes, closed=false){
    const d = nodesToPathData(nodes, closed);

    const path = new fabric.Path(d, {
      fill: closed ? currentAppearance.fill : null,
      stroke: currentAppearance.stroke,
      strokeWidth: currentAppearance.strokeWidth,
      strokeLineCap: currentAppearance.strokeLineCap,
      strokeLineJoin: currentAppearance.strokeLineJoin,
      objectCaching: false,
      selectable: true,
      evented: true,
      originX: 'left',
      originY: 'top'
    });

    path.jaType = 'vectorPath';
    path.jaNodes = nodes.map(n => ({
      x:n.x,
      y:n.y,
      inX:n.inX || 0,
      inY:n.inY || 0,
      outX:n.outX || 0,
      outY:n.outY || 0,
      type:n.type || 'corner'
    }));
    path.jaClosed = closed;
    path.jaName = 'Path';

    return path;
  }

  function nodesToPathData(nodes, closed=false){
    if (!nodes.length) return '';

    const n0 = nodes[0];

    let d = `M ${n0.x} ${n0.y}`;

    for (let i=1;i<nodes.length;i++){
      const a = nodes[i-1];
      const b = nodes[i];

      const c1x = a.x + (a.outX || 0);
      const c1y = a.y + (a.outY || 0);

      const c2x = b.x + (b.inX || 0);
      const c2y = b.y + (b.inY || 0);

      const hasCurve =
        (a.outX || a.outY || b.inX || b.inY);

      if (hasCurve){
        d += ` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${b.x} ${b.y}`;
      } else {
        d += ` L ${b.x} ${b.y}`;
      }
    }

    if (closed && nodes.length > 1){
      const a = nodes[nodes.length - 1];
      const b = nodes[0];

      const c1x = a.x + (a.outX || 0);
      const c1y = a.y + (a.outY || 0);

      const c2x = b.x + (b.inX || 0);
      const c2y = b.y + (b.inY || 0);

      const hasCurve =
        (a.outX || a.outY || b.inX || b.inY);

      if (hasCurve){
        d += ` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${b.x} ${b.y}`;
      } else {
        d += ` L ${b.x} ${b.y}`;
      }

      d += ' Z';
    }

    return d;
  }

  function replacePathGeometry(obj){
    if (!obj || obj.jaType !== 'vectorPath') return;

    const oldLeft = obj.left;
    const oldTop = obj.top;

    const d = nodesToPathData(obj.jaNodes, obj.jaClosed);

    const replacement = new fabric.Path(d, {
      left: oldLeft,
      top: oldTop,
      fill: obj.fill,
      stroke: obj.stroke,
      strokeWidth: obj.strokeWidth,
      strokeLineCap: obj.strokeLineCap,
      strokeLineJoin: obj.strokeLineJoin,
      scaleX: obj.scaleX,
      scaleY: obj.scaleY,
      angle: obj.angle,
      objectCaching:false,
      selectable:true,
      evented:true,
      originX:'left',
      originY:'top'
    });

    replacement.jaType = 'vectorPath';
    replacement.jaNodes = JSON.parse(JSON.stringify(obj.jaNodes));
    replacement.jaClosed = obj.jaClosed;
    replacement.jaName = obj.jaName || 'Path';

    const index = canvas.getObjects().indexOf(obj);

    canvas.remove(obj);
    canvas.insertAt(replacement, Math.max(0,index));

    canvas.setActiveObject(replacement);
    canvas.requestRenderAll();

    return replacement;
  }

  function pathWorldNodes(obj){
    return obj.jaNodes.map(n => ({
      x: obj.left + n.x,
      y: obj.top + n.y,
      inX: n.inX || 0,
      inY: n.inY || 0,
      outX: n.outX || 0,
      outY: n.outY || 0,
      type: n.type || 'corner'
    }));
  }

  function nearestNode(obj, point){
    if (!obj?.jaNodes?.length) return null;

    let best = null;

    obj.jaNodes.forEach((n,i) => {
      const x = obj.left + n.x;
      const y = obj.top + n.y;

      const dx = point.x - x;
      const dy = point.y - y;
      const d = Math.hypot(dx,dy);

      if (!best || d < best.distance){
        best = {
          index:i,
          distance:d,
          node:n,
          x,
          y
        };
      }
    });

    return best;
  }

  function cubicPoint(p0,p1,p2,p3,t){
    const mt = 1-t;

    return {
      x:
        mt*mt*mt*p0.x +
        3*mt*mt*t*p1.x +
        3*mt*t*t*p2.x +
        t*t*t*p3.x,

      y:
        mt*mt*mt*p0.y +
        3*mt*mt*t*p1.y +
        3*mt*t*t*p2.y +
        t*t*t*p3.y
    };
  }

  function cubicDerivative(p0,p1,p2,p3,t){
    const mt = 1-t;

    return {
      x:
        3*mt*mt*(p1.x-p0.x) +
        6*mt*t*(p2.x-p1.x) +
        3*t*t*(p3.x-p2.x),

      y:
        3*mt*mt*(p1.y-p0.y) +
        6*mt*t*(p2.y-p1.y) +
        3*t*t*(p3.y-p2.y)
    };
  }

  function nearestPointOnSegment(obj,index,point){
    const nodes = obj.jaNodes;

    const a = nodes[index];
    const b = nodes[(index+1)%nodes.length];

    if (!b) return null;

    const p0 = {
      x:obj.left+a.x,
      y:obj.top+a.y
    };

    const p1 = {
      x:p0.x+(a.outX||0),
      y:p0.y+(a.outY||0)
    };

    const p3 = {
      x:obj.left+b.x,
      y:obj.top+b.y
    };

    const p2 = {
      x:p3.x+(b.inX||0),
      y:p3.y+(b.inY||0)
    };

    let best = null;

    for (let i=0;i<=100;i++){
      const t=i/100;
      const p=cubicPoint(p0,p1,p2,p3,t);

      const dx=point.x-p.x;
      const dy=point.y-p.y;
      const d=Math.hypot(dx,dy);

      if (!best || d<best.distance){
        best={distance:d,t,p,p0,p1,p2,p3};
      }
    }

    return best;
  }

  function findNearestSegment(point){
    let best = null;

    canvas.getObjects().forEach(obj => {
      if (obj.jaType !== 'vectorPath') return;

      const count = obj.jaClosed
        ? obj.jaNodes.length
        : obj.jaNodes.length - 1;

      for (let i=0;i<count;i++){
        const result = nearestPointOnSegment(obj,i,point);

        if (result && (!best || result.distance < best.distance)){
          best = {
            obj,
            index:i,
            ...result
          };
        }
      }
    });

    return best;
  }

  function addAnchorToPath(obj,index,t){
    const nodes=obj.jaNodes;

    const a=nodes[index];
    const b=nodes[(index+1)%nodes.length];

    if (!b) return;

    const p0={x:a.x,y:a.y};

    const p1={
      x:a.x+(a.outX||0),
      y:a.y+(a.outY||0)
    };

    const p3={x:b.x,y:b.y};

    const p2={
      x:b.x+(b.inX||0),
      y:b.y+(b.inY||0)
    };

    const q0={
      x:p0.x+(p1.x-p0.x)*t,
      y:p0.y+(p1.y-p0.y)*t
    };

    const q1={
      x:p1.x+(p2.x-p1.x)*t,
      y:p1.y+(p2.y-p1.y)*t
    };

    const q2={
      x:p2.x+(p3.x-p2.x)*t,
      y:p2.y+(p3.y-p2.y)*t
    };

    const r0={
      x:q0.x+(q1.x-q0.x)*t,
      y:q0.y+(q1.y-q0.y)*t
    };

    const r1={
      x:q1.x+(q2.x-q1.x)*t,
      y:q1.y+(q2.y-q1.y)*t
    };

    const s={
      x:r0.x+(r1.x-r0.x)*t,
      y:r0.y+(r1.y-r0.y)*t
    };

    const left={
      ...a,
      outX:q0.x-a.x,
      outY:q0.y-a.y
    };

    const right={
      ...b,
      inX:q2.x-b.x,
      inY:q2.y-b.y
    };

    const mid={
      x:s.x,
      y:s.y,
      inX:r0.x-s.x,
      inY:r0.y-s.y,
      outX:r1.x-s.x,
      outY:r1.y-s.y,
      type:'smooth'
    };

    nodes.splice(index+1,0,left,mid,right);
    nodes.splice(index,1);

    return replacePathGeometry(obj);
  }

  function deleteAnchor(obj,index){
    if (!obj?.jaNodes || obj.jaNodes.length <= 2) return;

    obj.jaNodes.splice(index,1);
    replacePathGeometry(obj);
  }

  function toggleAnchorType(obj,index){
    const n=obj.jaNodes[index];

    if (!n) return;

    if (n.type === 'smooth'){
      n.type='corner';
      n.inX=0;
      n.inY=0;
      n.outX=0;
      n.outY=0;
    } else {
      n.type='smooth';

      const len=40;

      n.inX=-len;
      n.inY=0;
      n.outX=len;
      n.outY=0;
    }

    replacePathGeometry(obj);
  }

  function clearDirectControls(){
    directControls.forEach(o => canvas.remove(o));
    directControls=[];
    canvas.requestRenderAll();
  }

  function makeControlCircle(x,y,kind,index,obj){
    const circle=new fabric.Circle({
      left:x,
      top:y,
      radius:5,
      originX:'center',
      originY:'center',
      fill:kind==='anchor' ? '#ffffff' : '#8b5cf6',
      stroke:'#111111',
      strokeWidth:1,
      selectable:true,
      evented:true,
      hasControls:false,
      hoverCursor:'pointer',
      objectCaching:false
    });

    circle.jaControl=true;
    circle.jaControlKind=kind;
    circle.jaIndex=index;
    circle.jaTarget=obj;

    return circle;
  }

  function makeControlLine(x1,y1,x2,y2,index,kind,obj){
    const line=new fabric.Line(
      [x1,y1,x2,y2],
      {
        stroke:'#8b5cf6',
        strokeWidth:1,
        selectable:false,
        evented:false,
        objectCaching:false
      }
    );

    line.jaControl=true;
    line.jaControlKind=kind;
    line.jaIndex=index;
    line.jaTarget=obj;

    return line;
  }

  function showDirectControls(obj){
    clearDirectControls();

    if (!obj || obj.jaType !== 'vectorPath') return;

    obj.jaNodes.forEach((n,i) => {
      const ax=obj.left+n.x;
      const ay=obj.top+n.y;

      const inX=ax+(n.inX||0);
      const inY=ay+(n.inY||0);

      const outX=ax+(n.outX||0);
      const outY=ay+(n.outY||0);

      if (n.inX || n.inY){
        const line=makeControlLine(ax,ay,inX,inY,i,'in-line',obj);
        const handle=makeControlCircle(inX,inY,'in',i,obj);

        directControls.push(line,handle);
        canvas.add(line,handle);
      }

      if (n.outX || n.outY){
        const line=makeControlLine(ax,ay,outX,outY,i,'out-line',obj);
        const handle=makeControlCircle(outX,outY,'out',i,obj);

        directControls.push(line,handle);
        canvas.add(line,handle);
      }

      const anchor=makeControlCircle(ax,ay,'anchor',i,obj);

      directControls.push(anchor);
      canvas.add(anchor);
    });

    directControls.forEach(o => canvas.bringToFront(o));
    canvas.requestRenderAll();
  }

  function updateNodeFromControl(control){
    const obj=control.jaTarget;
    const i=control.jaIndex;
    const node=obj?.jaNodes?.[i];

    if (!obj || !node) return;

    const p={
      x:control.left,
      y:control.top
    };

    const ax=obj.left+node.x;
    const ay=obj.top+node.y;

    if (control.jaControlKind==='anchor'){
      node.x=p.x-obj.left;
      node.y=p.y-obj.top;
    }

    if (control.jaControlKind==='in'){
      node.inX=p.x-ax;
      node.inY=p.y-ay;
    }

    if (control.jaControlKind==='out'){
      node.outX=p.x-ax;
      node.outY=p.y-ay;
    }

    const replacement=replacePathGeometry(obj);

    if (replacement){
      showDirectControls(replacement);
    }
  }

  canvas.on('object:moving', e => {
    const o=e.target;

    if (o?.jaControl){
      updateNodeFromControl(o);
      return;
    }

    if (o?.jaType === 'artboard'){
      const ab=artboardByObject(o);

      if (ab){
        ab.x=o.left;
        ab.y=o.top;
      }

      return;
    }

    updateInspector();
  });

  canvas.on('object:scaling', e => {
    const o=e.target;

    if (o?.jaType === 'artboard'){
      const ab=artboardByObject(o);

      if (ab){
        ab.w=Math.max(1,o.getScaledWidth());
        ab.h=Math.max(1,o.getScaledHeight());

        o.set({
          width:ab.w,
          height:ab.h,
          scaleX:1,
          scaleY:1
        });

        $('artboardStatus').textContent =
          `Artboard: ${ab.name} · ${Math.round(ab.w)} × ${Math.round(ab.h)}`;
      }
    }

    updateInspector();
  });

  canvas.on('selection:created', e => {
    if (suppressSelectionEvent) return;

    const o=e.selected?.[0];

    if (o?.jaType === 'vectorPath' && activeTool === 'direct'){
      showDirectControls(o);
    }

    syncAppearanceFromObject(o);
    updateInspector();
  });

  canvas.on('selection:updated', e => {
    if (suppressSelectionEvent) return;

    const o=e.selected?.[0];

    if (o?.jaType === 'vectorPath' && activeTool === 'direct'){
      showDirectControls(o);
    } else {
      clearDirectControls();
    }

    syncAppearanceFromObject(o);
    updateInspector();
  });

  canvas.on('selection:cleared', () => {
    clearDirectControls();
    updateInspector();
  });

  function updateInspector(){
    const o=getActiveObject();

    if (!o){
      $('selectionInfo').textContent='Nothing selected.';
      $('objX').value='';
      $('objY').value='';
      $('objW').value='';
      $('objH').value='';
      $('objAngle').value='';
      return;
    }

    let name=o.jaName || o.name || o.jaType || o.type;

    $('selectionInfo').textContent=
      `${name} · ${Math.round(o.getScaledWidth())} × ${Math.round(o.getScaledHeight())}`;

    $('objX').value=Math.round(o.left*10)/10;
    $('objY').value=Math.round(o.top*10)/10;
    $('objW').value=Math.round(o.getScaledWidth()*10)/10;
    $('objH').value=Math.round(o.getScaledHeight()*10)/10;
    $('objAngle').value=Math.round((o.angle||0)*10)/10;

    if (o.jaType==='rectangle'){
      $('cornerRadius').value=o.jaCornerRadius||0;
    }
  }

  function applyTransformInputs(){
    const o=getActiveObject();
    if (!o) return;

    const x=Number($('objX').value);
    const y=Number($('objY').value);
    const w=Number($('objW').value);
    const h=Number($('objH').value);
    const angle=Number($('objAngle').value);

    if (Number.isFinite(x)) o.left=x;
    if (Number.isFinite(y)) o.top=y;

    if (Number.isFinite(w) && w>0){
      o.scaleX=w/o.width;
    }

    if (Number.isFinite(h) && h>0){
      o.scaleY=h/o.height;
    }

    if (Number.isFinite(angle)) o.angle=angle;

    o.setCoords();
    canvas.requestRenderAll();
    updateInspector();
  }

  ['objX','objY','objW','objH','objAngle'].forEach(id => {
    $(id).addEventListener('change',applyTransformInputs);
  });

  function createPenPreview(){
    if (!penState) return;

    if (penState.preview){
      canvas.remove(penState.preview);
      penState.preview=null;
    }

    if (penState.nodes.length===0) return;

    const nodes=penState.nodes.map(n=>({...n}));

    if (penState.previewPoint){
      nodes.push({
        x:penState.previewPoint.x,
        y:penState.previewPoint.y,
        inX:0,
        inY:0,
        outX:0,
        outY:0,
        type:'corner'
      });
    }

    if (nodes.length<2) return;

    const d=nodesToPathData(nodes,false);

    const preview=new fabric.Path(d,{
      fill:null,
      stroke:currentAppearance.stroke,
      strokeWidth:Math.max(.5,currentAppearance.strokeWidth),
      strokeDashArray:[6,5],
      selectable:false,
      evented:false,
      objectCaching:false
    });

    preview.jaPreview=true;
    penState.preview=preview;

    canvas.add(preview);
    canvas.bringToFront(preview);
  }

  function createPenControls(){
    if (!penState) return;

    penState.controls.forEach(o=>canvas.remove(o));
    penState.controls=[];

    penState.nodes.forEach((n,i)=>{
      const anchor=makeControlCircle(
        n.x,
        n.y,
        'pen-anchor',
        i,
        null
      );

      anchor.fill='#ffffff';
      anchor.stroke='#111111';
      anchor.jaPenControl=true;

      penState.controls.push(anchor);
      canvas.add(anchor);

      if (n.inX || n.inY){
        const hx=n.x+n.inX;
        const hy=n.y+n.inY;

        const line=makeControlLine(
          n.x,n.y,hx,hy,i,'pen-in',null
        );

        const handle=makeControlCircle(
          hx,hy,'pen-in',i,null
        );

        line.jaPenControl=true;
        handle.jaPenControl=true;

        penState.controls.push(line,handle);
        canvas.add(line,handle);
      }

      if (n.outX || n.outY){
        const hx=n.x+n.outX;
        const hy=n.y+n.outY;

        const line=makeControlLine(
          n.x,n.y,hx,hy,i,'pen-out',null
        );

        const handle=makeControlCircle(
          hx,hy,'pen-out',i,null
        );

        line.jaPenControl=true;
        handle.jaPenControl=true;

        penState.controls.push(line,handle);
        canvas.add(line,handle);
      }
    });

    penState.controls.forEach(o=>canvas.bringToFront(o));
  }

  function startPen(){
    penState={
      nodes:[],
      previewPoint:null,
      preview:null,
      controls:[],
      closed:false
    };

    canvas.discardActiveObject();
    setStatus('Pen tool ready');
  }

  function beginPenIfNeeded(){
    if (!penState) startPen();
  }

  function penPointerDown(opt){
    beginPenIfNeeded();

    const p=getPointer(opt);

    if (!penState.nodes.length){
      penState.nodes.push({
        x:p.x,
        y:p.y,
        inX:0,
        inY:0,
        outX:0,
        outY:0,
        type:'corner'
      });

      createPenControls();
      createPenPreview();
      canvas.requestRenderAll();
      return;
    }

    const first=penState.nodes[0];

    const distance=Math.hypot(
      p.x-first.x,
      p.y-first.y
    );

    if (penState.nodes.length>=2 && distance < 10){
      penState.closed=true;
      finishPen(true);
      return;
    }

    penState.nodes.push({
      x:p.x,
      y:p.y,
      inX:0,
      inY:0,
      outX:0,
      outY:0,
      type:'corner'
    });

    createPenControls();
    createPenPreview();
    canvas.requestRenderAll();
  }

  function penPointerMove(opt){
    if (!penState || !penState.nodes.length) return;

    const p=getPointer(opt);

    penState.previewPoint=p;
    createPenPreview();

    if (penState.dragging){
      const n=penState.nodes[penState.nodes.length-1];

      const dx=p.x-n.x;
      const dy=p.y-n.y;

      n.outX=dx;
      n.outY=dy;
      n.inX=-dx;
      n.inY=-dy;
      n.type='smooth';

      createPenControls();
      createPenPreview();
    }

    canvas.requestRenderAll();
  }

  function penPointerUp(){
    if (!penState) return;

    if (penState.dragging){
      penState.dragging=false;
      createPenControls();
      createPenPreview();
      canvas.requestRenderAll();
    }
  }

  function penPointerDownWithDrag(opt){
    if (!penState || !penState.nodes.length) return;

    const p=getPointer(opt);

    const last=penState.nodes[penState.nodes.length-1];

    const dx=p.x-last.x;
    const dy=p.y-last.y;

    if (Math.hypot(dx,dy)>1){
      penState.dragging=true;

      last.outX=dx;
      last.outY=dy;
      last.inX=-dx;
      last.inY=-dy;
      last.type='smooth';

      createPenControls();
      createPenPreview();

      canvas.requestRenderAll();
    }
  }

  function finishPen(createObject=true){
    if (!penState) return;

    const state=penState;

    if (state.preview){
      canvas.remove(state.preview);
    }

    state.controls.forEach(o=>canvas.remove(o));

    if (
      createObject &&
      state.nodes.length>=2
    ){
      const path=createVectorPath(
        state.nodes.map(n=>({...n})),
        !!state.closed
      );

      path.jaName='Pen Path';

      canvas.add(path);
      canvas.setActiveObject(path);
      path.setCoords();

      renderLayers();
      updateInspector();
    }

    penState=null;
    canvas.requestRenderAll();

    if (createObject){
      setStatus('Pen path created');
    }
  }

  function handleCanvasPointerDown(opt){
    if (activeTool==='pen'){
      penPointerDown(opt);
      return;
    }

    if (activeTool==='curvature'){
      curvaturePointerDown(opt);
      return;
    }

    if (activeTool==='add-anchor'){
      const p=getPointer(opt);
      const result=findNearestSegment(p);

      if (result && result.distance < 15){
        addAnchorToPath(
          result.obj,
          result.index,
          result.t
        );

        setStatus('Anchor added');
      }

      return;
    }

    if (activeTool==='delete-anchor'){
      const p=getPointer(opt);

      let best=null;

      canvas.getObjects().forEach(obj=>{
        if (obj.jaType!=='vectorPath') return;

        const n=nearestNode(obj,p);

        if (n && (!best || n.distance<best.distance)){
          best={obj,...n};
        }
      });

      if (best && best.distance<15){
        deleteAnchor(best.obj,best.index);
        setStatus('Anchor deleted');
      }

      return;
    }

    if (activeTool==='anchor'){
      const p=getPointer(opt);

      let best=null;

      canvas.getObjects().forEach(obj=>{
        if (obj.jaType!=='vectorPath') return;

        const n=nearestNode(obj,p);

        if (n && (!best || n.distance<best.distance)){
          best={obj,...n};
        }
      });

      if (best && best.distance<15){
        toggleAnchorType(best.obj,best.index);
        setStatus(
          best.obj.jaNodes[best.index]?.type === 'smooth'
            ? 'Anchor converted to smooth'
            : 'Anchor converted to corner'
        );
      }

      return;
    }

    if (
      activeTool==='shape' ||
      activeTool==='ellipse' ||
      activeTool==='polygon' ||
      activeTool==='star' ||
      activeTool==='line'
    ){
      beginShape(getPointer(opt));
      return;
    }

    if (activeTool==='text'){
      const p=getPointer(opt);

      const text=new fabric.IText('Type here',{
        left:p.x,
        top:p.y,
        fill:currentAppearance.stroke || '#111111',
        fontSize:32,
        fontFamily:'Arial',
        selectable:true
      });

      text.jaType='text';
      text.jaName='Text';

      canvas.add(text);
      canvas.setActiveObject(text);
      text.enterEditing();

      setTool('select');
      return;
    }

    if (activeTool==='zoom'){
      const p=getPointer(opt);
      zoomAtPoint(p,1.25);
      return;
    }
  }

  function handleCanvasPointerMove(opt){
    if (activeTool==='pen'){
      penPointerMove(opt);
      return;
    }

    if (activeTool==='curvature'){
      curvaturePointerMove(opt);
      return;
    }

    if (shapeState){
      updateShape(getPointer(opt));
    }
  }

  function handleCanvasPointerUp(){
    if (activeTool==='pen'){
      penPointerUp();
      return;
    }

    if (shapeState){
      finishShape();
    }
  }

  canvas.on('mouse:down', handleCanvasPointerDown);
  canvas.on('mouse:move', handleCanvasPointerMove);
  canvas.on('mouse:up', handleCanvasPointerUp);

  canvas.on('mouse:down', opt => {
    if (activeTool==='pen' && penState){
      penPointerDownWithDrag(opt);
    }
  });

  function curvaturePointerDown(opt){
    if (!penState){
      penState={
        nodes:[],
        previewPoint:null,
        preview:null,
        controls:[],
        closed:false,
        curvature:true
      };
    }

    const p=getPointer(opt);

    if (
      penState.nodes.length>=2 &&
      Math.hypot(
        p.x-penState.nodes[0].x,
        p.y-penState.nodes[0].y
      ) < 10
    ){
      penState.closed=true;
      finishPen(true);
      return;
    }

    if (penState.nodes.length){
      const prev=penState.nodes[penState.nodes.length-1];

      const dx=p.x-prev.x;
      const dy=p.y-prev.y;

      const len=Math.hypot(dx,dy)||1;

      const handle=Math.min(70,len*.35);

      const ux=dx/len;
      const uy=dy/len;

      prev.outX=ux*handle;
      prev.outY=uy*handle;

      const node={
        x:p.x,
        y:p.y,
        inX:-ux*handle,
        inY:-uy*handle,
        outX:0,
        outY:0,
        type:'smooth'
      };

      penState.nodes.push(node);
    } else {
      penState.nodes.push({
        x:p.x,
        y:p.y,
        inX:0,
        inY:0,
        outX:0,
        outY:0,
        type:'smooth'
      });
    }

    createPenControls();
    createPenPreview();
    canvas.requestRenderAll();
  }

  function curvaturePointerMove(opt){
    if (!penState || !penState.nodes.length) return;

    penState.previewPoint=getPointer(opt);
    createPenPreview();
    canvas.requestRenderAll();
  }

  function beginShape(p){
    shapeState={
      start:{...p},
      current:{...p},
      type:activeTool,
      object:null
    };

    setStatus('Drag to draw shape');
  }

  function updateShape(p){
    if (!shapeState) return;

    shapeState.current={...p};

    const x=Math.min(shapeState.start.x,p.x);
    const y=Math.min(shapeState.start.y,p.y);
    const w=Math.abs(p.x-shapeState.start.x);
    const h=Math.abs(p.y-shapeState.start.y);

    if (shapeState.object){
      canvas.remove(shapeState.object);
    }

    let obj;

    if (shapeState.type==='shape'){
      obj=new fabric.Rect({
        left:x,
        top:y,
        width:Math.max(1,w),
        height:Math.max(1,h),
        rx:0,
        ry:0,
        fill:currentAppearance.fill,
        stroke:currentAppearance.stroke,
        strokeWidth:currentAppearance.strokeWidth,
        strokeLineCap:currentAppearance.strokeLineCap,
        strokeLineJoin:currentAppearance.strokeLineJoin,
        objectCaching:false,
        selectable:false
      });

      obj.jaType='rectangle';
      obj.jaCornerRadius=0;
      obj.jaName='Rectangle';
    }

    if (shapeState.type==='ellipse'){
      obj=new fabric.Ellipse({
        left:x,
        top:y,
        rx:Math.max(1,w/2),
        ry:Math.max(1,h/2),
        fill:currentAppearance.fill,
        stroke:currentAppearance.stroke,
        strokeWidth:currentAppearance.strokeWidth,
        objectCaching:false,
        selectable:false
      });

      obj.jaType='ellipse';
      obj.jaName='Ellipse';
    }

    if (shapeState.type==='polygon'){
      const radius=Math.max(1,Math.min(w,h)/2);

      obj=new fabric.Polygon(
        regularPolygonPoints(6,radius),
        {
          left:x+w/2,
          top:y+h/2,
          originX:'center',
          originY:'center',
          fill:currentAppearance.fill,
          stroke:currentAppearance.stroke,
          strokeWidth:currentAppearance.strokeWidth,
          objectCaching:false,
          selectable:false
        }
      );

      obj.jaType='polygon';
      obj.jaSides=6;
      obj.jaRadius=radius;
      obj.jaName='Polygon';
    }

    if (shapeState.type==='star'){
      const radius=Math.max(1,Math.min(w,h)/2);

      obj=new fabric.Polygon(
        starPoints(5,radius,radius*.45),
        {
          left:x+w/2,
          top:y+h/2,
          originX:'center',
          originY:'center',
          fill:currentAppearance.fill,
          stroke:currentAppearance.stroke,
          strokeWidth:currentAppearance.strokeWidth,
          objectCaching:false,
          selectable:false
        }
      );

      obj.jaType='star';
      obj.jaPoints=5;
      obj.jaRadius=radius;
      obj.jaInnerRadius=radius*.45;
      obj.jaName='Star';
    }

    if (shapeState.type==='line'){
      obj=new fabric.Line(
        [shapeState.start.x,shapeState.start.y,p.x,p.y],
        {
          fill:null,
          stroke:currentAppearance.stroke,
          strokeWidth:currentAppearance.strokeWidth,
          strokeLineCap:currentAppearance.strokeLineCap,
          selectable:false
        }
      );

      obj.jaType='line';
      obj.jaName='Line';
    }

    if (obj){
      shapeState.object=obj;
      canvas.add(obj);
      canvas.requestRenderAll();
    }
  }

  function finishShape(){
    if (!shapeState) return;

    const obj=shapeState.object;

    if (obj){
      obj.set({
        selectable:true,
        evented:true
      });

      canvas.setActiveObject(obj);
      renderLayers();
      updateInspector();
    }

    shapeState=null;
    canvas.requestRenderAll();
    setStatus('Shape created');
  }

  function regularPolygonPoints(sides,radius){
    const pts=[];

    for(let i=0;i<sides;i++){
      const a=-Math.PI/2+(Math.PI*2*i/sides);

      pts.push({
        x:Math.cos(a)*radius,
        y:Math.sin(a)*radius
      });
    }

    return pts;
  }

  function starPoints(points,outer,inner){
    const pts=[];

    for(let i=0;i<points*2;i++){
      const r=i%2===0?outer:inner;
      const a=-Math.PI/2+(Math.PI*i/points);

      pts.push({
        x:Math.cos(a)*r,
        y:Math.sin(a)*r
      });
    }

    return pts;
  }

  function renderLayers(){
    const box=$('layers');
    box.innerHTML='';

    const objects=canvas.getObjects()
      .filter(o=>o.jaType!=='artboard');

    objects.slice().reverse().forEach((o,index)=>{
      const row=document.createElement('div');
      row.className='layer';

      const eye=document.createElement('span');
      eye.className='eye';
      eye.textContent=o.visible===false?'○':'●';

      eye.addEventListener('click',e=>{
        e.stopPropagation();

        o.visible=o.visible===false;
        eye.textContent=o.visible===false?'○':'●';

        canvas.requestRenderAll();
      });

      const name=document.createElement('span');
      name.className='layer-name';
      name.textContent=o.jaName||o.name||o.type;

      row.appendChild(eye);
      row.appendChild(name);

      row.addEventListener('click',()=>{
        canvas.setActiveObject(o);
        canvas.requestRenderAll();
        updateInspector();

        if(activeTool==='direct' && o.jaType==='vectorPath'){
          showDirectControls(o);
        }
      });

      box.appendChild(row);
    });

    artboards.forEach(ab=>{
      const row=document.createElement('div');
      row.className='layer artboard-item'+
        (ab.id===activeArtboardId?' active':'');

      const name=document.createElement('span');
      name.className='name';
      name.textContent=ab.name;

      const size=document.createElement('span');
      size.className='size';
      size.textContent=`${Math.round(ab.w)}×${Math.round(ab.h)}`;

      row.appendChild(name);
      row.appendChild(size);

      row.addEventListener('click',()=>{
        activeArtboardId=ab.id;
        setActiveArtboard(ab.id);
        fitRectToView(ab.x,ab.y,ab.w,ab.h);
      });

      box.appendChild(row);
    });
  }

  function zoomAtPoint(point,factor){
    const before=screenToWorld(point);

    let z=canvas.getZoom()*factor;
    z=Math.max(.05,Math.min(8,z));

    canvas.zoomToPoint(
      new fabric.Point(point.x,point.y),
      z
    );

    const after=screenToWorld(point);

    canvas.relativePan(
      new fabric.Point(
        (after.x-before.x)*z,
        (after.y-before.y)*z
      )
    );

    updateZoomStatus();
    canvas.requestRenderAll();
  }

  function setupHandTool(){
    canvas.on('mouse:down',opt=>{
      if(activeTool!=='hand') return;

      handState={
        x:opt.e.clientX,
        y:opt.e.clientY,
        vpt:[...canvas.viewportTransform]
      };

      workspace.classList.add('panning');
    });

    canvas.on('mouse:move',opt=>{
      if(activeTool!=='hand' || !handState) return;

      const dx=opt.e.clientX-handState.x;
      const dy=opt.e.clientY-handState.y;

      canvas.setViewportTransform([
        handState.vpt[0],
        handState.vpt[1],
        handState.vpt[2],
        handState.vpt[3],
        handState.vpt[4]+dx,
        handState.vpt[5]+dy
      ]);

      canvas.requestRenderAll();
    });

    canvas.on('mouse:up',()=>{
      if(activeTool==='hand'){
        handState=null;
        workspace.classList.remove('panning');
      }
    });
  }

  setupHandTool();

  function saveDocument(){
    const data={
      version:8,
      artboards:artboards.map(a=>({
        id:a.id,
        name:a.name,
        w:a.w,
        h:a.h,
        x:a.x,
        y:a.y,
        preset:a.preset
      })),
      activeArtboardId,
      nextId,
      appearance:currentAppearance,
      canvas:canvas.toJSON([
        'jaType',
        'jaNodes',
        'jaClosed',
        'jaName',
        'jaCornerRadius',
        'jaSides',
        'jaRadius',
        'jaPoints',
        'jaInnerRadius',
        'jaArtboardId'
      ])
    };

    localStorage.setItem(
      'justAngles_v8_document',
      JSON.stringify(data)
    );

    setStatus('Document saved');
  }

  function loadDocument(){
    const raw=localStorage.getItem('justAngles_v8_document');

    if(!raw){
      setStatus('No saved document found');
      return;
    }

    try{
      const data=JSON.parse(raw);

      canvas.clear();

      artboards=[];
      activeArtboardId=null;

      if(data.appearance){
        currentAppearance={
          ...DEFAULT_APPEARANCE,
          ...data.appearance
        };
      }

      artboards=(data.artboards||[]).map(a=>({
        ...a,
        rect:null
      }));

      activeArtboardId=data.activeArtboardId||artboards[0]?.id||null;
      nextId=data.nextId||1;

      canvas.loadFromJSON(
        data.canvas,
        ()=>{
          artboards.forEach(ab=>{
            const rect=canvas.getObjects().find(
              o=>o.jaType==='artboard' &&
              o.jaArtboardId===ab.id
            );

            if(rect){
              ab.rect=rect;
            }else{
              makeArtboardRect(ab);
            }
          });

          syncAppearanceUI();
          setActiveArtboard(activeArtboardId);
          renderLayers();
          updateInspector();
          canvas.requestRenderAll();

          const ab=activeArtboard();

          if(ab){
            fitRectToView(ab.x,ab.y,ab.w,ab.h);
          }

          setStatus('Document loaded');
        }
      );
    }catch(err){
      console.error(err);
      setStatus('Unable to load document');
    }
  }

  function syncAppearanceUI(){
    if(currentAppearance.fill){
      $('fillColor').value=currentAppearance.fill;
      $('fillText').value=currentAppearance.fill;
      $('topFill').value=currentAppearance.fill;
      $('contextFill').value=currentAppearance.fill;
    }else{
      $('fillText').value='None';
    }

    setCurrentStroke(currentAppearance.stroke);
    setCurrentStrokeWidth(currentAppearance.strokeWidth);

    $('strokeCap').value=currentAppearance.strokeLineCap;
    $('strokeJoin').value=currentAppearance.strokeLineJoin;
  }

  $('saveBtn').addEventListener('click',saveDocument);
  $('loadBtn').addEventListener('click',loadDocument);

  $('newBtn').addEventListener('click',()=>{
    if(confirm('Start a new document?')){
      canvas.clear();
      artboards=[];
      activeArtboardId=null;
      nextId=1;
      ensureDefaultArtboard();
      renderLayers();
    }
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(penState){
        finishPen(false);
      }

      if(shapeState){
        if(shapeState.object){
          canvas.remove(shapeState.object);
        }

        shapeState=null;
        canvas.requestRenderAll();
      }

      return;
    }

    if(e.key==='Enter'){
      if(penState){
        finishPen(true);
        return;
      }
    }

    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='s'){
      e.preventDefault();
      saveDocument();
    }

    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='z'){
      e.preventDefault();
      setStatus('Undo is reserved for the next history pass');
    }

    if(e.key==='v' || e.key==='V'){
      if(!e.target.matches('input,textarea,select')){
        setTool('select');
      }
    }

    if(e.key==='a' || e.key==='A'){
      if(!e.target.matches('input,textarea,select')){
        setTool('direct');
      }
    }

    if(e.key==='p' || e.key==='P'){
      if(!e.target.matches('input,textarea,select')){
        setTool('pen');
      }
    }

    if(e.key==='t' || e.key==='T'){
      if(!e.target.matches('input,textarea,select')){
        setTool('text');
      }
    }

    if(e.key==='h' || e.key==='H'){
      if(!e.target.matches('input,textarea,select')){
        setTool('hand');
      }
    }
  });

  canvas.on('object:modified',()=>{
    renderLayers();
    updateInspector();
  });

  canvas.on('object:added',()=>{
    renderLayers();
  });

  canvas.on('object:removed',()=>{
    renderLayers();
  });

  canvas.on('mouse:wheel',opt=>{
    if(!opt.e.ctrlKey && !opt.e.metaKey) return;

    opt.e.preventDefault();
    opt.e.stopPropagation();

    const p=getPointer(opt);

    const factor=
      opt.e.deltaY < 0
        ? 1.1
        : .9;

    zoomAtPoint(p,factor);
  });

  function initialize(){
    resizeCanvas();

    syncAppearanceUI();

    ensureDefaultArtboard();

    setTool('select');

    renderLayers();

    updateInspector();

    const ab=activeArtboard();

    if(ab){
      fitRectToView(ab.x,ab.y,ab.w,ab.h);
    }

    setStatus('Ready');
  }

  initialize();

})();
</script>
</body>
</html>
